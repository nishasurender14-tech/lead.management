<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIP CRM Pro V3</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase/config.js"></script><style>:root{--b:#2563eb;--dark:#0b1220;--bg:#f5f7fb;--line:#e5e7eb;--muted:#64748b}*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#172033;background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:410px;max-width:100%;background:#fff;padding:32px;border-radius:20px;box-shadow:0 20px 60px #0002}.logo{display:flex;gap:12px;align-items:center}.logo b{background:var(--b);color:#fff;border-radius:12px;padding:13px;font-size:20px}.logo h1{margin:0}.muted{color:var(--muted)}.input{width:100%;padding:10px 12px;border:1px solid #d7dce5;border-radius:9px;margin:5px 0;background:#fff}.btn{padding:9px 13px;border:1px solid #d7dce5;background:#fff;border-radius:9px;font-weight:700}.primary{background:var(--b);border-color:var(--b);color:#fff}.authbox .btn{width:100%;margin-top:8px}.msg{margin:10px 0;padding:10px;border-radius:8px;background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}.side{position:fixed;inset:0 auto 0 0;width:235px;background:var(--dark);color:#cbd5e1;padding:16px}.side h2{color:#fff;margin:8px 8px 25px}.nav{display:block;width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px;border-radius:8px;margin:2px 0}.nav:hover,.nav.active{background:#172238;color:#fff}.main{margin-left:235px;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0}.page{display:none}.page.active{display:block}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:13px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px}.card small{color:var(--muted)}.card strong{display:block;font-size:25px;margin-top:6px}.panel{margin-top:15px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}.head h2,.head h3{margin:0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:10px;border-bottom:1px solid #edf0f4;white-space:nowrap}th{font-size:11px;color:var(--muted);text-transform:uppercase;background:#f8fafc}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:bold}.green{background:#dcfce7;color:#166534}.red{background:#fee2e2;color:#991b1b}.yellow{background:#fef3c7;color:#92400e}.blue{background:#e0f2fe;color:#075985}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.toolbar .input{width:auto;min-width:180px}.pipeline{display:flex;gap:12px;overflow:auto}.stage{min-width:205px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px}.deal{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px}.money{color:#059669;font-weight:bold}.empty{text-align:center;padding:28px;color:var(--muted)}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:20px;z-index:30}.modal.open{display:grid}.modalbox{width:700px;max-width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:15px;padding:22px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.actions{text-align:right;margin-top:15px}.profile{display:grid;grid-template-columns:1fr 1fr;gap:15px}.profile .panel{margin:0}.score{font-size:22px;font-weight:bold}.click{cursor:pointer}@media(max-width:1000px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.side{width:60px;padding:8px}.side h2{display:none}.nav{font-size:0;text-align:center}.main{margin-left:60px;padding:13px}.top{align-items:flex-start;flex-direction:column}.grid,.profile{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:500px){.cards{grid-template-columns:1fr}}</style></head><body>
<div id="auth" class="auth"><div class="authbox"><div class="logo"><b>K</b><div><h1>KIP CRM Pro</h1><div class="muted">V3 • Sales workspace</div></div></div><div id="msg"></div><input id="email" class="input" type="email" placeholder="Email"><input id="password" class="input" type="password" placeholder="Password"><button class="btn primary" onclick="login()">Sign In</button><button class="btn" onclick="signup()">Create Account</button></div></div>
<div id="app" class="hidden"><aside class="side"><h2>KIP CRM</h2><button class="nav active" data-page="dashboard">🏠 Dashboard</button><button class="nav" data-page="leads">👤 Leads</button><button class="nav" data-page="contacts">📇 Contacts</button><button class="nav" data-page="accounts">🏢 Accounts</button><button class="nav" data-page="deals">💰 Deals</button><button class="nav" data-page="activities">📋 Activities</button><button class="nav" data-page="campaigns">📣 Campaigns</button><button class="nav" data-page="reports">📊 Reports</button><button class="nav" data-page="settings">⚙️ Settings</button><button class="nav" onclick="logout()">🚪 Sign Out</button></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div id="org" class="muted"></div></div><div><span id="user" class="muted"></span> <button class="btn primary" onclick="openLead()">+ New Lead</button></div></div>
<section id="dashboard" class="page active"><div id="cards" class="cards"></div><div class="panel"><div class="head"><h3>Today's Work</h3><button class="btn" onclick="show('activities')">Activities</button></div><div id="today"></div></div><div class="panel"><div class="head"><h3>Recent Leads</h3><button class="btn" onclick="show('leads')">All Leads</button></div><div id="recent"></div></div></section>
<section id="leads" class="page"><div class="panel"><div class="head"><h2>Lead Management</h2><button class="btn primary" onclick="openLead()">+ New Lead</button></div><div class="toolbar"><input id="leadSearch" class="input" placeholder="Search name, company, phone..." oninput="renderLeads()"><select id="leadStatus" class="input" onchange="renderLeads()"><option value="">All Statuses</option></select><select id="leadSource" class="input" onchange="renderLeads()"><option value="">All Sources</option></select></div><div id="leadTable"></div></div></section>
<section id="contacts" class="page"><div class="panel"><div class="head"><h2>Contacts</h2></div><div id="contactTable"></div></div></section><section id="accounts" class="page"><div class="panel"><div class="head"><h2>Accounts</h2></div><div id="accountTable"></div></div></section>
<section id="deals" class="page"><div class="panel"><div class="head"><h2>Deal Pipeline</h2><button class="btn primary" onclick="openDeal()">+ New Deal</button></div><div id="pipeline" class="pipeline"></div></div></section>
<section id="activities" class="page"><div class="panel"><div class="head"><h2>Activities & Follow-ups</h2><button class="btn primary" onclick="openActivity()">+ New Activity</button></div><div id="activityTable"></div></div></section>
<section id="campaigns" class="page"><div class="panel"><div class="head"><h2>Campaigns</h2></div><div id="campaignTable"></div></div></section>
<section id="reports" class="page"><div id="reportCards" class="cards"></div><div class="panel"><h3>Lead Sources</h3><div id="sourceReport"></div></div><div class="panel"><h3>Lead Status</h3><div id="statusReport"></div></div></section>
<section id="settings" class="page"><div class="panel"><div class="head"><h2>CRM Settings</h2><button class="btn primary" onclick="saveSettings()">Save</button></div><label>Lead statuses<input id="statuses" class="input"></label><label>Deal stages<input id="stages" class="input"></label><label>Lead sources<input id="sources" class="input"></label><label>Custom lead fields<input id="customFields" class="input" placeholder="GSTIN, Budget, Product Interest"></label><div id="settingsMsg" class="muted"></div></div></section>
</main></div><div id="modal" class="modal"><div class="modalbox"><div class="head"><h2 id="modalTitle"></h2><button class="btn" onclick="closeModal()">✕</button></div><div id="form" class="grid"></div><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" id="saveBtn">Save</button></div></div></div>
<script>const db=supabase.createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.key);let user,profile,org,settings={};const D={leads:[],contacts:[],accounts:[],deals:[],activities:[],campaigns:[]};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const money=v=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(v||0));const badge=s=>{let c=['Converted','Won','Completed'].includes(s)?'green':['Lost','Not Interested'].includes(s)?'red':['Follow-up','Negotiation'].includes(s)?'yellow':['Contacted','Qualified'].includes(s)?'blue':'';return '<span class="badge '+c+'">'+esc(s||'New')+'</span>'};function err(t){document.getElementById('msg').innerHTML='<div class="msg">'+esc(t)+'</div>'}
async function signup(){const e=email.value.trim(),p=password.value;if(!e||p.length<6)return err('Enter a valid email and password of at least 6 characters.');const r=await db.auth.signUp({email:e,password:p});if(r.error)return err(r.error.message);if(!r.data.session)return err('Account created. Confirm your email, then sign in.');await boot(r.data.user)}async function login(){const r=await db.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error)return err(r.error.message);await boot(r.data.user)}async function logout(){await db.auth.signOut();location.reload()}
async function boot(u){user=u;let r=await db.from('crm_profiles').select('*').eq('id',u.id).maybeSingle();if(r.error)return err(r.error.message);profile=r.data;if(!profile){const n=prompt('Your full name:')||u.email.split('@')[0],o=prompt('Company / Organization name:');if(!o)return; r=await db.rpc('crm_create_organization',{org_name:o,user_name:n});if(r.error)return err(r.error.message);r=await db.from('crm_profiles').select('*').eq('id',u.id).single();profile=r.data}r=await db.from('crm_organizations').select('*').eq('id',profile.organization_id).single();if(r.error)return err(r.error.message);org=r.data;document.getElementById('auth').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('org').textContent=org.name;document.getElementById('user').textContent=profile.full_name||u.email;await load();show('dashboard')}
async function load(){for(const t in D){const r=await db.from('crm_'+t).select('*').eq('organization_id',org.id).order('created_at',{ascending:false});D[t]=r.data||[]}const s=await db.from('crm_settings').select('*').eq('organization_id',org.id).single();settings=s.data||{};fillSettings();fillFilters();render()}
function show(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));document.getElementById('title').textContent={dashboard:'Dashboard',leads:'Leads',contacts:'Contacts',accounts:'Accounts',deals:'Deals',activities:'Activities',campaigns:'Campaigns',reports:'Reports & Analytics',settings:'CRM Settings'}[p]}
document.querySelectorAll('[data-page]').forEach(x=>x.onclick=()=>show(x.dataset.page));function table(h,rows){return rows.length?'<div class="tablewrap"><table><thead><tr>'+h.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>':'<div class="empty">No records found.</div>'}
function render(){renderDash();renderLeads();document.getElementById('contactTable').innerHTML=table(['Name','Company','Email','Phone','Designation'],D.contacts.map(x=>[esc(x.name),esc(x.account_id||'-'),esc(x.email||'-'),esc(x.phone||'-'),esc(x.designation||'-')]));document.getElementById('accountTable').innerHTML=table(['Account','Industry','Phone','GSTIN','PAN'],D.accounts.map(x=>[esc(x.name),esc(x.industry||'-'),esc(x.phone||'-'),esc(x.gstin||'-'),esc(x.pan||'-')]));renderDeals();document.getElementById('activityTable').innerHTML=table(['Subject','Type','Status','Due'],D.activities.map(x=>[esc(x.subject),esc(x.type),badge(x.status),esc(x.due_at?new Date(x.due_at).toLocaleString():'-')]));document.getElementById('campaignTable').innerHTML=table(['Campaign','Channel','Status','Budget','Leads','Conversions'],D.campaigns.map(x=>[esc(x.name),esc(x.channel||'-'),badge(x.status),money(x.budget),x.leads_count||0,x.conversions||0]));renderReports();renderDeals()}
function renderDash(){const pipe=D.deals.filter(x=>!['Won','Lost'].includes(x.stage)).reduce((a,x)=>a+Number(x.amount||0),0),won=D.deals.filter(x=>x.stage==='Won').reduce((a,x)=>a+Number(x.amount||0),0),conv=D.leads.filter(x=>x.status==='Converted').length;document.getElementById('cards').innerHTML=[['Total Leads',D.leads.length],['Qualified',D.leads.filter(x=>x.status==='Qualified').length],['Follow-ups',D.leads.filter(x=>x.next_follow_up&&new Date(x.next_follow_up)<=new Date()).length],['Pipeline',money(pipe)],['Won Revenue',money(won)]].map(x=>'<div class="card"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('');document.getElementById('recent').innerHTML=table(['Lead','Company','Score','Status'],D.leads.slice(0,8).map(x=>['<span class="click" onclick="openLeadView(\''+x.id+'\')"><b>'+esc(x.name)+'</b></span>',esc(x.company||'-'),'<span class="score">'+(x.score||0)+'</span>',badge(x.status)]));const now=new Date(),a=D.activities.filter(x=>x.due_at&&new Date(x.due_at)<=new Date(now.getTime()+86400000));document.getElementById('today').innerHTML=table(['Task','Type','Due','Status'],a.slice(0,10).map(x=>[esc(x.subject),esc(x.type),esc(new Date(x.due_at).toLocaleString()),badge(x.status)]))}
function renderLeads(){const q=(document.getElementById('leadSearch')?.value||'').toLowerCase(),st=document.getElementById('leadStatus')?.value||'',so=document.getElementById('leadSource')?.value||'';let a=D.leads.filter(x=>(!q||JSON.stringify(x).toLowerCase().includes(q))&&(!st||x.status===st)&&(!so||x.source===so));document.getElementById('leadTable').innerHTML=table(['Lead','Company','Contact','Source','Status','Score','Follow-up','Action'],a.map(x=>['<span class="click" onclick="openLeadView(\''+x.id+'\')"><b>'+esc(x.name)+'</b></span>',esc(x.company||'-'),esc(x.phone||x.email||'-'),esc(x.source||'-'),badge(x.status),'<b>'+x.score+'</b>',esc(x.next_follow_up?new Date(x.next_follow_up).toLocaleDateString():'-'),x.status!=='Converted'?'<button class="btn" onclick="convertLead(\''+x.id+'\')">Convert</button>':'✓']))}
function renderDeals(){const stages=Array.isArray(settings.deal_stages)?settings.deal_stages:['New','Qualification','Proposal','Negotiation','Won','Lost'];document.getElementById('pipeline').innerHTML=stages.map(s=>'<div class="stage"><b>'+esc(s)+'</b><div class="muted">'+D.deals.filter(x=>x.stage===s).length+' deals</div>'+D.deals.filter(x=>x.stage===s).map(x=>'<div class="deal"><b>'+esc(x.title)+'</b><div class="money">'+money(x.amount)+'</div><select class="input" onchange="moveDeal(\''+x.id+'\',this.value)">'+stages.map(z=>'<option '+(z===x.stage?'selected':'')+'>'+esc(z)+'</option>').join('')+'</select></div>').join('')+'</div>').join('')}
function renderReports(){const conv=D.leads.filter(x=>x.status==='Converted').length;document.getElementById('reportCards').innerHTML=[['Leads',D.leads.length],['Converted',conv],['Conversion',D.leads.length?Math.round(conv/D.leads.length*100)+'%':'0%'],['Deals',D.deals.length],['Won',money(D.deals.filter(x=>x.stage==='Won').reduce((a,x)=>a+Number(x.amount||0),0))]].map(x=>'<div class="card"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('');const group=(k)=>{const o={};D.leads.forEach(x=>o[x[k]||'Unknown']=(o[x[k]||'Unknown']||0)+1);return Object.entries(o).map(([x,n])=>'<p><b>'+esc(x)+'</b> — '+n+'</p>').join('')||'<div class="empty">No data.</div>'};document.getElementById('sourceReport').innerHTML=group('source');document.getElementById('statusReport').innerHTML=group('status')}
function fillFilters(){leadStatus.innerHTML='<option value="">All Statuses</option>'+(settings.lead_statuses||[]).map(x=>'<option>'+esc(x)+'</option>').join('');leadSource.innerHTML='<option value="">All Sources</option>'+(settings.lead_sources||[]).map(x=>'<option>'+esc(x)+'</option>').join('')}
function fillSettings(){const f=(x)=>Array.isArray(x)?x.join(', '):'';statuses.value=f(settings.lead_statuses);stages.value=f(settings.deal_stages);sources.value=f(settings.lead_sources);customFields.value=f(settings.custom_lead_fields)}
function closeModal(){modal.classList.remove('open')}function openModal(title,html,save){modalTitle.textContent=title;form.innerHTML=html;modal.classList.add('open');saveBtn.onclick=save}function opts(a){return a.map(x=>'<option>'+esc(x)+'</option>').join('')}function openLead(){const fs=settings.custom_lead_fields||[];openModal('New Lead','<div><b>Full Name *</b><input id="n" class="input"></div><div><b>Company</b><input id="c" class="input"></div><div><b>Email</b><input id="e" class="input"></div><div><b>Phone</b><input id="p" class="input"></div><div><b>Source</b><select id="s" class="input">'+opts(settings.lead_sources||['Website'])+'</select></div><div><b>Status</b><select id="st" class="input">'+opts(settings.lead_statuses||['New'])+'</select></div><div><b>Score (0-100)</b><input id="sc" class="input" type="number" min="0" max="100" value="0"></div><div><b>Next Follow-up</b><input id="fu" class="input" type="datetime-local"></div><div class="full"><b>Notes</b><textarea id="no" class="input"></textarea></div>'+fs.map(x=>'<div><b>'+esc(x)+'</b><input id="x_'+esc(x).replace(/[^a-zA-Z0-9]/g,'_')+'" class="input"></div>').join(''),async()=>{if(!n.value.trim())return alert('Name is required');const custom={};fs.forEach(x=>custom[x]=document.getElementById('x_'+x.replace(/[^a-zA-Z0-9]/g,'_')).value);const r=await db.from('crm_leads').insert({organization_id:org.id,owner_id:user.id,name:n.value.trim(),company:c.value,email:e.value,phone:p.value,source:s.value,status:st.value,score:Number(sc.value||0),next_follow_up:fu.value||null,notes:no.value,custom_data:custom});if(r.error)return alert(r.error.message);closeModal();await load()})}
function openDeal(){openModal('New Deal','<div class="full"><b>Deal Title *</b><input id="dt" class="input"></div><div><b>Amount</b><input id="da" class="input" type="number"></div><div><b>Stage</b><select id="ds" class="input">'+opts(settings.deal_stages||['New'])+'</select></div><div><b>Probability %</b><input id="dp" class="input" type="number" value="0"></div><div><b>Expected Close</b><input id="dc" class="input" type="date"></div>',async()=>{if(!dt.value.trim())return alert('Deal title is required');const r=await db.from('crm_deals').insert({organization_id:org.id,owner_id:user.id,title:dt.value,amount:Number(da.value||0),stage:ds.value,probability:Number(dp.value||0),expected_close:dc.value||null});if(r.error)return alert(r.error.message);closeModal();await load()})}
function openActivity(){openModal('New Activity','<div class="full"><b>Subject *</b><input id="as" class="input"></div><div><b>Type</b><select id="at" class="input"><option>Task</option><option>Call</option><option>Meeting</option><option>Email</option></select></div><div><b>Status</b><select id="ax" class="input"><option>Pending</option><option>Completed</option></select></div><div class="full"><b>Due</b><input id="ad" class="input" type="datetime-local"></div><div class="full"><b>Description</b><textarea id="aa" class="input"></textarea></div>',async()=>{if(!as.value.trim())return alert('Subject is required');const r=await db.from('crm_activities').insert({organization_id:org.id,owner_id:user.id,subject:as.value,type:at.value,status:ax.value,due_at:ad.value||null,description:aa.value});if(r.error)return alert(r.error.message);closeModal();await load()})}
async function convertLead(id){if(!confirm('Convert this lead into Contact + Account + Deal?'))return;const r=await db.rpc('crm_convert_lead',{p_lead:id,make_deal:true});if(r.error)return alert(r.error.message);await load();show('contacts');alert('Lead converted successfully. Contact, Account and Deal created.')}async function moveDeal(id,stage){const r=await db.from('crm_deals').update({stage,updated_at:new Date().toISOString()}).eq('id',id).eq('organization_id',org.id);if(r.error)return alert(r.error.message);await load()}
async function openLeadView(id){const x=D.leads.find(z=>z.id===id);if(!x)return;const ev=await db.from('crm_lead_events').select('*').eq('lead_id',id).order('created_at',{ascending:false});openModal('Lead Profile','<div class="profile full"><div class="panel"><h3>'+esc(x.name)+'</h3><p>'+esc(x.company||'')+'</p><p>'+esc(x.email||'')+'</p><p>'+esc(x.phone||'')+'</p><p>Status: '+badge(x.status)+'</p><p>Lead Score: <b>'+x.score+'</b>/100</p><p>Source: '+esc(x.source||'-')+'</p></div><div class="panel"><h3>Timeline</h3>'+((ev.data||[]).map(e=>'<p><b>'+esc(e.event_type)+'</b><br><small>'+esc(e.description||'')+' • '+new Date(e.created_at).toLocaleString()+'</small></p>').join('')||'<p class="muted">No events yet.</p>')+'</div></div>',()=>closeModal())}
async function saveSettings(){const csv=id=>document.getElementById(id).value.split(',').map(x=>x.trim()).filter(Boolean);const p={lead_statuses:csv('statuses'),deal_stages:csv('stages'),lead_sources:csv('sources'),custom_lead_fields:csv('customFields'),updated_at:new Date().toISOString()};const r=await db.from('crm_settings').update(p).eq('organization_id',org.id);if(r.error)return settingsMsg.textContent=r.error.message;settings={...settings,...p};settingsMsg.textContent='Saved successfully.';fillFilters();render()}
db.auth.getSession().then(r=>{if(r.data.session)boot(r.data.session.user)});</script></body></html>
