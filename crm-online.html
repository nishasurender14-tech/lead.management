<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lead Management CRM Online</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;font:14px Arial;background:#f5f7fb;color:#172033}.app{display:flex;min-height:100vh}.side{width:220px;background:#111827;color:white;padding:20px;position:fixed;height:100%;box-sizing:border-box}.side h2{margin-top:0}.side button{display:block;width:100%;padding:11px;margin:5px 0;background:transparent;color:#ddd;border:0;text-align:left;border-radius:7px;cursor:pointer}.side button:hover,.side button.active{background:#2563eb;color:white}.main{margin-left:220px;padding:25px;width:calc(100% - 220px);box-sizing:border-box}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:white;border:1px solid #e5e7eb;border-radius:10px;padding:18px}.value{font-size:26px;font-weight:800;margin-top:7px}.toolbar{display:flex;gap:10px;margin:15px 0}.input,select,button{padding:10px;border:1px solid #d6dce5;border-radius:7px}.primary{background:#2563eb;color:#fff;border:0}.table{width:100%;border-collapse:collapse;background:#fff}.table th,.table td{padding:11px;border-bottom:1px solid #eee;text-align:left}.hidden{display:none!important}.auth{min-height:100vh;display:flex;align-items:center;justify-content:center}.authbox{background:#fff;padding:25px;border-radius:12px;width:min(420px,90%);box-shadow:0 10px 35px #0001}.authbox input{width:100%;margin:7px 0;box-sizing:border-box}.error{color:#b91c1c;margin:10px 0}.modal{position:fixed;inset:0;background:#0008;display:none;align-items:center;justify-content:center}.modal.open{display:flex}.modalbox{background:#fff;padding:22px;border-radius:12px;width:min(700px,92%)}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}@media(max-width:800px){.side{width:65px}.side h2{font-size:0}.side button{font-size:0;text-align:center}.side button:after{content:'•';font-size:20px}.main{margin-left:65px;width:calc(100% - 65px)}.cards{grid-template-columns:1fr 1fr}}@media(max-width:600px){.cards,.form{grid-template-columns:1fr}.full{grid-column:auto}}</style></head><body><div id="auth" class="auth"><div class="authbox"><h1>Lead Management CRM</h1><p>Online Zoho-style CRM</p><input id="email" class="input" type="email" placeholder="Email"><input id="password" class="input" type="password" placeholder="Password"><button class="primary" style="width:100%" onclick="login()">Sign In</button><button style="width:100%;margin-top:8px" onclick="signup()">Create Account</button><div id="authMsg"></div></div></div><div id="app" class="app hidden"><aside class="side"><h2>CRM</h2><button onclick="show('dashboard',this)">Dashboard</button><button onclick="show('leads',this)">Leads</button><button onclick="show('contacts',this)">Contacts</button><button onclick="show('accounts',this)">Accounts</button><button onclick="show('deals',this)">Deals</button><button onclick="show('activities',this)">Activities</button><button onclick="show('campaigns',this)">Campaigns</button><button onclick="logout()">Sign out</button></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><span id="org"></span></div><span id="user"></span></div><section id="dashboard"><div class="cards" id="stats"></div><div class="panel" style="margin-top:18px"><h3>Sales Pipeline</h3><div id="pipeline"></div></div></section><section id="leads" class="hidden"><div class="top"><h2>Leads</h2><button class="primary" onclick="openLead()">+ Add Lead</button></div><div class="toolbar"><input id="leadSearch" class="input" placeholder="Search leads" oninput="renderLeads()"></div><div class="panel"><table class="table"><thead><tr><th>Name</th><th>Company</th><th>Phone</th><th>Status</th><th>Source</th></tr></thead><tbody id="leadRows"></tbody></table></div></section><section id="contacts" class="hidden"><Module title="Contacts" table="contacts"></Module></section><section id="accounts" class="hidden"><Module title="Accounts" table="accounts"></Module></section><section id="deals" class="hidden"><Module title="Deals" table="deals"></Module></section><section id="activities" class="hidden"><Module title="Activities" table="activities"></Module></section><section id="campaigns" class="hidden"><Module title="Campaigns" table="campaigns"></Module></section></main></div><div id="leadModal" class="modal"><div class="modalbox"><h2>Add Lead</h2><form id="leadForm" class="form"><input id="lname" class="input" placeholder="Lead name" required><input id="lcompany" class="input" placeholder="Company"><input id="lphone" class="input" placeholder="Phone"><input id="lemail" class="input" placeholder="Email"><input id="lsource" class="input" placeholder="Source" value="Website"><select id="lstatus" class="input"><option>New</option><option>Contacted</option><option>Follow-up</option><option>Converted</option><option>Not Interested</option><option>Lost</option></select><textarea id="lnotes" class="full" placeholder="Notes"></textarea><div class="full"><button type="button" onclick="closeLead()">Cancel</button><button class="primary">Save</button></div></form></div></div><script>const CFG=window.SUPABASE_CONFIG||{url:'https://kgpmyxkrtkjqkqxedxsu.supabase.co',key:'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtncG15eGtydGtqcWtxeGVkeHN1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODcyMDE2MzgsImV4cCI6MjEwMjc3NzYzOH0.pnfFMrgJ9l8vGZ2O-ihGrWEvNe3fJ7qidYftvpDHb2g'};const db=supabase.createClient(CFG.url,CFG.key);let user,profile,org,leads=[];const $=x=>document.getElementById(x);function err(x){$('authMsg').innerHTML='<div class="error">'+x+'</div>'}async function login(){let r=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});if(r.error)return err(r.error.message);boot()}async function signup(){let r=await db.auth.signUp({email:$('email').value,password:$('password').value});if(r.error)return err(r.error.message);if(r.data.session)boot();else err('Account created. Check your email for confirmation.')}async function boot(){let s=(await db.auth.getSession()).data.session;if(!s)return;user=s.user;let p=await db.from('profiles').select('*').eq('id',user.id).maybeSingle();profile=p.data;if(!profile||!profile.organization_id){err('Your account has no organization yet. Use the existing organization setup in the main CRM.');return}let o=await db.from('organizations').select('*').eq('id',profile.organization_id).single();org=o.data;$('auth').classList.add('hidden');$('app').classList.remove('hidden');$('org').textContent=org.name;$('user').textContent=profile.full_name||user.email;load()}async function load(){let r=await db.from('leads').select('*').eq('organization_id',org.id).order('created_at',{ascending:false});if(!r.error){leads=r.data||[];renderLeads();renderDashboard()}}function show(id,b){document.querySelectorAll('main section').forEach(x=>x.classList.add('hidden'));$(id).classList.remove('hidden');$('title').textContent=b?b.textContent:id[0].toUpperCase()+id.slice(1);document.querySelectorAll('.side button').forEach(x=>x.classList.remove('active'));if(b)b.classList.add('active');if(['contacts','accounts','deals','activities','campaigns'].includes(id))loadModule(id)}function renderDashboard(){let stages=['New','Contacted','Follow-up','Converted','Not Interested','Lost'];$('stats').innerHTML='<div class="card"><div>Total Leads</div><div class="value">'+leads.length+'</div></div>'+stages.slice(0,3).map(s=>'<div class="card"><div>'+s+'</div><div class="value">'+leads.filter(x=>x.status===s).length+'</div></div>').join('');$('pipeline').innerHTML=stages.map(s=>'<div>'+s+': <b>'+leads.filter(x=>x.status===s).length+'</b></div>').join('')}function renderLeads(){let q=($('leadSearch').value||'').toLowerCase();$('leadRows').innerHTML=leads.filter(x=>(x.name||'').toLowerCase().includes(q)||(x.company||'').toLowerCase().includes(q)||(x.phone||'').includes(q)).map(x=>'<tr><td>'+esc(x.name)+'</td><td>'+esc(x.company)+'</td><td>'+esc(x.phone)+'</td><td>'+esc(x.status)+'</td><td>'+esc(x.source)+'</td></tr>').join('')}async function loadModule(id){let table=id==='deals'?'deals':id;let r=await db.from(table).select('*').eq('organization_id',org.id).order('created_at',{ascending:false}).limit(100);let sec=$(id);if(r.error){sec.innerHTML='<div class="panel error">'+r.error.message+'</div>';return}let rows=r.data||[];sec.innerHTML='<div class="top"><h2>'+id[0].toUpperCase()+id.slice(1)+'</h2></div><div class="panel"><table class="table"><thead><tr><th>Record</th><th>Status/Type</th><th>Created</th></tr></thead><tbody>'+rows.map(x=>'<tr><td>'+esc(x.name||x.subject||((x.first_name||'')+' '+(x.last_name||'')))+'</td><td>'+esc(x.status||x.stage||x.type||'')+'</td><td>'+new Date(x.created_at).toLocaleDateString()+'</td></tr>').join('')+'</tbody></table></div>'}function openLead(){$('leadModal').classList.add('open')}function closeLead(){$('leadModal').classList.remove('open')}function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}$('leadForm').onsubmit=async e=>{e.preventDefault();let r=await db.from('leads').insert({organization_id:org.id,name:$('lname').value,company:$('lcompany').value,phone:$('lphone').value,email:$('lemail').value,source:$('lsource').value,status:$('lstatus').value,notes:$('lnotes').value,created_by:user.id}).select().single();if(r.error)return alert(r.error.message);closeLead();e.target.reset();load()};async function logout(){await db.auth.signOut();location.reload()}boot();</script></body></html>
