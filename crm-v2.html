<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIP CRM Pro V2</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase/config.js"></script><style>
:root{--blue:#2563eb;--dark:#0b1220;--bg:#f5f7fb;--line:#e5e7eb;--muted:#64748b}*{box-sizing:border-box}body{margin:0;font:14px Arial;color:#172033;background:var(--bg)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;padding:20px}.authbox{width:410px;max-width:100%;background:white;padding:32px;border-radius:20px;box-shadow:0 20px 60px #0002}.logo{display:flex;gap:12px;align-items:center;margin-bottom:24px}.logo b{background:var(--blue);color:#fff;border-radius:12px;padding:13px;font-size:20px}.logo h1{margin:0}.muted{color:var(--muted)}.input{width:100%;padding:11px 12px;border:1px solid #d7dce5;border-radius:9px;margin:5px 0;outline:0;background:#fff}.input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #dbeafe}.btn{padding:10px 14px;border:1px solid #d7dce5;background:#fff;border-radius:9px;font-weight:700}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.authbox .btn{width:100%;margin-top:7px}.msg{margin:10px 0;padding:10px;border-radius:8px;background:#fee2e2;color:#991b1b}.ok{background:#dcfce7;color:#166534}.side{position:fixed;inset:0 auto 0 0;width:235px;background:var(--dark);color:#cbd5e1;padding:16px;overflow:auto}.side h2{color:#fff;margin:8px 8px 25px}.nav{width:100%;border:0;background:transparent;color:#cbd5e1;text-align:left;padding:11px;border-radius:8px;margin:2px 0}.nav:hover,.nav.active{background:#172238;color:#fff}.main{margin-left:235px;padding:24px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top h1{margin:0}.pages>.page{display:none}.pages>.page.active{display:block}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:18px}.panel{margin-top:15px}.card small{color:var(--muted)}.card strong{display:block;font-size:26px;margin-top:7px}.head{display:flex;justify-content:space-between;align-items:center;margin-bottom:15px}.head h2,.head h3{margin:0}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:11px;border-bottom:1px solid #edf0f4;white-space:nowrap}th{font-size:11px;color:var(--muted);background:#f8fafc;text-transform:uppercase}.badge{display:inline-block;padding:5px 8px;border-radius:20px;background:#eef2ff;color:#3730a3;font-size:11px;font-weight:bold}.green{background:#dcfce7;color:#166534}.red{background:#fee2e2;color:#991b1b}.yellow{background:#fef3c7;color:#92400e}.blue{background:#e0f2fe;color:#075985}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;padding:20px;z-index:20}.modal.open{display:grid}.modalbox{width:680px;max-width:100%;max-height:90vh;overflow:auto;background:#fff;border-radius:15px;padding:22px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.actions{text-align:right;margin-top:15px}.pipeline{display:flex;gap:12px;overflow:auto}.stage{min-width:190px;background:#f8fafc;border:1px solid var(--line);border-radius:10px;padding:12px}.deal{background:#fff;border:1px solid var(--line);border-radius:8px;padding:10px;margin-top:8px}.money{color:#059669;font-weight:bold}.empty{text-align:center;padding:28px;color:var(--muted)}@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){.side{width:60px;padding:8px}.side h2{display:none}.nav{text-align:center;font-size:0}.nav:first-letter{font-size:18px}.main{margin-left:60px;padding:14px}.top{align-items:flex-start;gap:10px;flex-direction:column}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:500px){.cards{grid-template-columns:1fr}}
</style></head><body>
<div id="auth" class="auth"><div class="authbox"><div class="logo"><b>K</b><div><h1>KIP CRM Pro</h1><div class="muted">Custom online CRM</div></div></div><div id="msg"></div><input id="email" class="input" type="email" placeholder="Email address"><input id="password" class="input" type="password" placeholder="Password"><button id="loginBtn" class="btn primary" onclick="login()">Sign In</button><button id="signupBtn" class="btn" onclick="signup()">Create Account</button></div></div>
<div id="app" class="hidden"><aside class="side"><h2>KIP CRM</h2><button class="nav active" data-page="dashboard">🏠 Dashboard</button><button class="nav" data-page="leads">👤 Leads</button><button class="nav" data-page="contacts">📇 Contacts</button><button class="nav" data-page="accounts">🏢 Accounts</button><button class="nav" data-page="deals">💰 Deals</button><button class="nav" data-page="activities">📋 Activities</button><button class="nav" data-page="campaigns">📣 Campaigns</button><button class="nav" data-page="reports">📊 Reports</button><button class="nav" data-page="settings">⚙️ Settings</button><button class="nav" onclick="logout()">🚪 Sign Out</button></aside><main class="main"><div class="top"><div><h1 id="title">Dashboard</h1><div id="org" class="muted"></div></div><div><span id="user" class="muted"></span> <button class="btn primary" onclick="openForm('lead')">+ Add Lead</button></div></div><div class="pages">
<section id="dashboard" class="page active"><div id="cards" class="cards"></div><div class="panel"><div class="head"><h3>Recent Leads</h3><button class="btn" onclick="show('leads')">View all</button></div><div id="recent"></div></div></section>
<section id="leads" class="page"><div class="panel"><div class="head"><h2>Leads</h2><button class="btn primary" onclick="openForm('lead')">+ New Lead</button></div><input id="search" class="input" placeholder="Search leads" oninput="renderLeads()"><div id="leadTable"></div></div></section>
<section id="contacts" class="page"><div class="panel"><div class="head"><h2>Contacts</h2><button class="btn primary" onclick="openForm('contact')">+ New Contact</button></div><div id="contactTable"></div></div></section>
<section id="accounts" class="page"><div class="panel"><div class="head"><h2>Accounts</h2><button class="btn primary" onclick="openForm('account')">+ New Account</button></div><div id="accountTable"></div></div></section>
<section id="deals" class="page"><div class="panel"><div class="head"><h2>Deal Pipeline</h2><button class="btn primary" onclick="openForm('deal')">+ New Deal</button></div><div id="pipeline" class="pipeline"></div></div></section>
<section id="activities" class="page"><div class="panel"><div class="head"><h2>Activities</h2><button class="btn primary" onclick="openForm('activity')">+ New Activity</button></div><div id="activityTable"></div></div></section>
<section id="campaigns" class="page"><div class="panel"><div class="head"><h2>Campaigns</h2><button class="btn primary" onclick="openForm('campaign')">+ New Campaign</button></div><div id="campaignTable"></div></div></section>
<section id="reports" class="page"><div id="reportCards" class="cards"></div><div class="panel"><h3>Lead Status</h3><div id="statusReport"></div></div></section>
<section id="settings" class="page"><div class="panel"><div class="head"><h2>CRM Settings</h2><button class="btn primary" onclick="saveSettings()">Save Settings</button></div><p class="muted">Customize your pipeline, lead sources and custom lead fields.</p><label><b>Lead statuses</b><input id="statuses" class="input" placeholder="New, Contacted, Qualified, Follow-up, Converted, Lost"></label><label><b>Deal stages</b><input id="stages" class="input" placeholder="New, Qualification, Proposal, Negotiation, Won, Lost"></label><label><b>Lead sources</b><input id="sources" class="input" placeholder="Website, Facebook, Google, WhatsApp"></label><label><b>Custom Lead Fields</b><input id="customFields" class="input" placeholder="Budget, GSTIN, Product Interest"></label><p id="settingsMsg" class="muted"></p></div></section>
</div></main></div>
<div id="modal" class="modal"><div class="modalbox"><div class="head"><h2 id="modalTitle">New Record</h2><button class="btn" onclick="closeModal()">✕</button></div><div id="form" class="formgrid"></div><div class="actions"><button class="btn" onclick="closeModal()">Cancel</button> <button id="save" class="btn primary">Save</button></div></div></div>
<script>
const db=supabase.createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.key);let user=null,profile=null,org=null,settings=null;const R={leads:[],contacts:[],accounts:[],deals:[],activities:[],campaigns:[]};const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));const money=v=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(v||0));function msg(t,ok=false){document.getElementById('msg').innerHTML='<div class="msg '+(ok?'ok':'')+'">'+esc(t)+'</div>'}function badge(s){s=s||'New';let c=['Converted','Won','Completed'].includes(s)?'green':['Lost','Not Interested'].includes(s)?'red':['Follow-up','Negotiation'].includes(s)?'yellow':['Contacted','Qualified'].includes(s)?'blue':'';return '<span class="badge '+c+'">'+esc(s)+'</span>'}
async function signup(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email)return msg('Enter your email.');if(password.length<6)return msg('Password must be at least 6 characters.');document.getElementById('signupBtn').disabled=true;try{const r=await db.auth.signUp({email,password});if(r.error)return msg(r.error.message);if(!r.data.session)return msg('Account created. Check your email, confirm the account, then sign in.',true);await boot(r.data.user)}catch(e){msg(e.message)}finally{document.getElementById('signupBtn').disabled=false}}async function login(){const email=document.getElementById('email').value.trim(),password=document.getElementById('password').value;if(!email||!password)return msg('Enter email and password.');const r=await db.auth.signInWithPassword({email,password});if(r.error)return msg(r.error.message);await boot(r.data.user)}async function logout(){await db.auth.signOut();location.reload()}
async function boot(u){user=u;let r=await db.from('crm_profiles').select('*').eq('id',u.id).maybeSingle();if(r.error)return msg(r.error.message);profile=r.data;if(!profile){const name=prompt('Your full name:')||u.email.split('@')[0];const orgName=prompt('Company / Organization name:');if(!orgName)return msg('Organization name is required.');r=await db.rpc('crm_create_organization',{org_name:orgName,user_name:name});if(r.error)return msg(r.error.message);r=await db.from('crm_profiles').select('*').eq('id',u.id).single();if(r.error)return msg(r.error.message);profile=r.data}r=await db.from('crm_organizations').select('*').eq('id',profile.organization_id).single();if(r.error)return msg(r.error.message);org=r.data;document.getElementById('auth').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('org').textContent=org.name;document.getElementById('user').textContent=profile.full_name||u.email;await load();show('dashboard')}
async function load(){for(const t in R){const r=await db.from('crm_'+t).select('*').eq('organization_id',org.id).order('created_at',{ascending:false});R[t]=r.data||[]}const s=await db.from('crm_settings').select('*').eq('organization_id',org.id).single();settings=s.data||{};fillSettings();renderAll()}
function show(p){document.querySelectorAll('.page').forEach(x=>x.classList.remove('active'));document.getElementById(p).classList.add('active');document.querySelectorAll('.nav').forEach(x=>x.classList.toggle('active',x.dataset.page===p));const titles={dashboard:'Dashboard',leads:'Leads',contacts:'Contacts',accounts:'Accounts',deals:'Deals',activities:'Activities',campaigns:'Campaigns',reports:'Reports & Analytics',settings:'CRM Settings'};document.getElementById('title').textContent=titles[p]||p}
document.querySelectorAll('.nav[data-page]').forEach(x=>x.onclick=()=>show(x.dataset.page));function table(head,rows){if(!rows.length)return '<div class="empty">No records yet.</div>';return '<div class="tablewrap"><table><thead><tr>'+head.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(x=>'<td>'+x+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}
function renderAll(){renderDashboard();renderLeads();document.getElementById('contactTable').innerHTML=table(['Name','Email','Phone','Designation'],R.contacts.map(x=>[esc(x.name),esc(x.email||'-'),esc(x.phone||'-'),esc(x.designation||'-')]));document.getElementById('accountTable').innerHTML=table(['Account','Industry','Phone','GSTIN'],R.accounts.map(x=>[esc(x.name),esc(x.industry||'-'),esc(x.phone||'-'),esc(x.gstin||'-')]));renderDeals();document.getElementById('activityTable').innerHTML=table(['Subject','Type','Status','Due'],R.activities.map(x=>[esc(x.subject),esc(x.type),badge(x.status),esc(x.due_at?new Date(x.due_at).toLocaleString():'-')]));document.getElementById('campaignTable').innerHTML=table(['Campaign','Channel','Status','Budget','Conversions'],R.campaigns.map(x=>[esc(x.name),esc(x.channel||'-'),badge(x.status),money(x.budget),x.conversions||0]));renderReports()}
function renderDashboard(){const pipeline=R.deals.reduce((a,x)=>a+Number(x.amount||0),0),won=R.deals.filter(x=>x.stage==='Won').reduce((a,x)=>a+Number(x.amount||0),0);document.getElementById('cards').innerHTML=[['Leads',R.leads.length],['Contacts',R.contacts.length],['Open Deals',R.deals.filter(x=>!['Won','Lost'].includes(x.stage)).length],['Pipeline',money(pipeline)],['Won Revenue',money(won)]].map(x=>'<div class="card"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('');document.getElementById('recent').innerHTML=table(['Name','Company','Source','Status'],R.leads.slice(0,8).map(x=>[esc(x.name),esc(x.company||'-'),esc(x.source||'-'),badge(x.status)]))}
function renderLeads(){const q=(document.getElementById('search')?.value||'').toLowerCase();const a=R.leads.filter(x=>JSON.stringify(x).toLowerCase().includes(q));document.getElementById('leadTable').innerHTML=table(['Name','Company','Email','Phone','Source','Status'],a.map(x=>[esc(x.name),esc(x.company||'-'),esc(x.email||'-'),esc(x.phone||'-'),esc(x.source||'-'),badge(x.status)]))}
function renderDeals(){const stages=Array.isArray(settings?.deal_stages)?settings.deal_stages:['New','Qualification','Proposal','Negotiation','Won','Lost'];document.getElementById('pipeline').innerHTML=stages.map(s=>'<div class="stage"><b>'+esc(s)+'</b><div class="muted">'+R.deals.filter(x=>x.stage===s).length+' deals</div>'+R.deals.filter(x=>x.stage===s).map(x=>'<div class="deal"><b>'+esc(x.title)+'</b><div class="money">'+money(x.amount)+'</div><small>'+esc(x.probability||0)+'%</small></div>').join('')+'</div>').join('')}
function renderReports(){const conv=R.leads.filter(x=>x.status==='Converted').length;const revenue=R.deals.filter(x=>x.stage==='Won').reduce((a,x)=>a+Number(x.amount||0),0);document.getElementById('reportCards').innerHTML=[['Total Leads',R.leads.length],['Converted',conv],['Conversion Rate',R.leads.length?Math.round(conv/R.leads.length*100)+'%':'0%'],['Won Revenue',money(revenue)]].map(x=>'<div class="card"><small>'+x[0]+'</small><strong>'+x[1]+'</strong></div>').join('');const counts={};R.leads.forEach(x=>counts[x.status]=(counts[x.status]||0)+1);document.getElementById('statusReport').innerHTML=Object.entries(counts).map(([s,n])=>'<p><b>'+esc(s)+'</b> — '+n+'</p>').join('')||'<div class="empty">No lead data.</div>'}
const defs={lead:{title:'New Lead',table:'crm_leads',fields:[['name','Full Name','text',1],['company','Company','text'],['email','Email','email'],['phone','Phone','text'],['source','Source','source'],['status','Status','status'],['notes','Notes','textarea',0,1]]},contact:{title:'New Contact',table:'crm_contacts',fields:[['name','Full Name','text',1],['email','Email','email'],['phone','Phone','text'],['designation','Designation','text'],['notes','Notes','textarea',0,1]]},account:{title:'New Account',table:'crm_accounts',fields:[['name','Account Name','text',1],['industry','Industry','text'],['phone','Phone','text'],['website','Website','text'],['gstin','GSTIN','text'],['pan','PAN','text'],['address','Address','textarea',0,1]]},deal:{title:'New Deal',table:'crm_deals',fields:[['title','Deal Title','text',1],['amount','Amount','number'],['stage','Stage','stage'],['probability','Probability %','number'],['expected_close','Expected Close','date'],['notes','Notes','textarea',0,1]]},activity:{title:'New Activity',table:'crm_activities',fields:[['subject','Subject','text',1],['type','Type','text'],['status','Status','text'],['due_at','Due Date','datetime-local'],['description','Description','textarea',0,1]]},campaign:{title:'New Campaign',table:'crm_campaigns',fields:[['name','Campaign Name','text',1],['channel','Channel','text'],['status','Status','text'],['budget','Budget','number'],['notes','Notes','textarea',0,1]]}};
function opts(type){if(type==='source')return Array.isArray(settings?.lead_sources)?settings.lead_sources:['Website','Facebook','Google','WhatsApp','Referral','Exhibition','Other'];if(type==='status')return Array.isArray(settings?.lead_statuses)?settings.lead_statuses:['New','Contacted','Qualified','Follow-up','Converted','Lost','Not Interested'];if(type==='stage')return Array.isArray(settings?.deal_stages)?settings.deal_stages:['New','Qualification','Proposal','Negotiation','Won','Lost'];return null}
function openForm(type){const d=defs[type];document.getElementById('modalTitle').textContent=d.title;let fields=d.fields.slice();if(type==='lead'&&Array.isArray(settings?.custom_lead_fields)){settings.custom_lead_fields.forEach(n=>fields.push([n,n,'text']))}document.getElementById('form').innerHTML=fields.map(f=>{let el;if(['source','status','stage'].includes(f[2]))el='<select id="f_'+f[0]+'" class="input">'+opts(f[2]).map(o=>'<option>'+esc(o)+'</option>').join('')+'</select>';else if(f[2]==='textarea')el='<textarea id="f_'+f[0]+'" class="input" rows="4" placeholder="'+esc(f[1])+'"></textarea>';else el='<input id="f_'+f[0]+'" class="input" type="'+f[2]+'" placeholder="'+esc(f[1])+'">';return '<div class="'+(f[4]?'full':'')+'"><b>'+esc(f[1])+(f[3]?' *':'')+'</b>'+el+'</div>'}).join('');document.getElementById('modal').classList.add('open');document.getElementById('save').onclick=()=>saveForm(type,fields)}
function closeModal(){document.getElementById('modal').classList.remove('open')}
async function saveForm(type,fields){const d=defs[type],o={organization_id:org.id};const custom={};for(const f of fields){const v=document.getElementById('f_'+f[0]).value.trim();if(f[3]&&!v)return alert(f[1]+' is required.');if(type==='lead'&&settings?.custom_lead_fields?.includes(f[0]))custom[f[0]]=v;else o[f[0]]=v||null}if(type==='lead')o.custom_data=custom;o.owner_id=user.id;const r=await db.from(d.table).insert(o);if(r.error)return alert(r.error.message);closeModal();await load()}
function fillSettings(){const arr=x=>Array.isArray(x)?x.join(', '):'';document.getElementById('statuses').value=arr(settings.lead_statuses);document.getElementById('stages').value=arr(settings.deal_stages);document.getElementById('sources').value=arr(settings.lead_sources);document.getElementById('customFields').value=arr(settings.custom_lead_fields)}async function saveSettings(){const csv=id=>document.getElementById(id).value.split(',').map(x=>x.trim()).filter(Boolean);const payload={lead_statuses:csv('statuses'),deal_stages:csv('stages'),lead_sources:csv('sources'),custom_lead_fields:csv('customFields'),updated_at:new Date().toISOString()};const r=await db.from('crm_settings').update(payload).eq('organization_id',org.id);if(r.error)return document.getElementById('settingsMsg').textContent=r.error.message;settings={...settings,...payload};document.getElementById('settingsMsg').textContent='Settings saved successfully.';renderAll()}
db.auth.getSession().then(r=>{if(r.data.session)boot(r.data.session.user)});
</script></body></html>
