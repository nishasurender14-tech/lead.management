<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIP CRM Pro</title>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="supabase/config.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f7fb;
      color: #172033;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .hidden {
      display: none !important;
    }

    /* AUTH */

    .auth-screen {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      background: linear-gradient(135deg, #eef4ff, #f8fafc);
    }

    .auth-card {
      width: 420px;
      max-width: 100%;
      background: #fff;
      padding: 35px;
      border-radius: 20px;
      box-shadow: 0 25px 70px rgba(0,0,0,.12);
      border: 1px solid #e5e7eb;
    }

    .brand-box {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 25px;
    }

    .brand-logo {
      width: 48px;
      height: 48px;
      border-radius: 14px;
      background: #2563eb;
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 22px;
      font-weight: 900;
    }

    .brand-title {
      margin: 0;
      font-size: 24px;
    }

    .brand-subtitle {
      margin: 4px 0 0;
      color: #64748b;
      font-size: 13px;
    }

    .input {
      width: 100%;
      padding: 12px 13px;
      margin: 6px 0;
      border: 1px solid #d8dee8;
      border-radius: 10px;
      outline: none;
      background: white;
    }

    .input:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px #dbeafe;
    }

    .btn {
      border: 1px solid #d8dee8;
      background: white;
      padding: 10px 15px;
      border-radius: 9px;
      font-weight: 700;
    }

    .btn-primary {
      background: #2563eb;
      color: white;
      border-color: #2563eb;
    }

    .btn-danger {
      color: #b91c1c;
    }

    .auth-card .btn {
      width: 100%;
      margin-top: 8px;
    }

    .message {
      padding: 11px;
      border-radius: 9px;
      margin: 10px 0;
      background: #fee2e2;
      color: #991b1b;
      font-size: 14px;
    }

    .message.success {
      background: #dcfce7;
      color: #166534;
    }

    /* APP */

    .sidebar {
      position: fixed;
      left: 0;
      top: 0;
      bottom: 0;
      width: 240px;
      background: #0b1220;
      color: white;
      padding: 18px 12px;
      overflow-y: auto;
    }

    .sidebar-brand {
      padding: 10px;
      font-size: 20px;
      font-weight: 900;
      margin-bottom: 20px;
    }

    .sidebar-brand span {
      color: #60a5fa;
    }

    .nav-title {
      font-size: 10px;
      text-transform: uppercase;
      color: #64748b;
      letter-spacing: 1px;
      padding: 10px;
    }

    .nav-button {
      width: 100%;
      border: 0;
      background: transparent;
      color: #cbd5e1;
      padding: 11px 12px;
      text-align: left;
      border-radius: 9px;
      margin: 2px 0;
    }

    .nav-button:hover,
    .nav-button.active {
      background: #172238;
      color: white;
    }

    .main {
      margin-left: 240px;
      padding: 25px;
      min-height: 100vh;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      margin-bottom: 25px;
    }

    .topbar h1 {
      margin: 0;
      font-size: 28px;
    }

    .muted {
      color: #64748b;
    }

    .user-pill {
      background: white;
      border: 1px solid #e5e7eb;
      padding: 9px 13px;
      border-radius: 20px;
      font-size: 13px;
    }

    /* DASHBOARD */

    .cards {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 15px;
    }

    .card {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 18px;
    }

    .card-label {
      color: #64748b;
      font-size: 13px;
    }

    .card-value {
      font-size: 28px;
      font-weight: 900;
      margin-top: 7px;
    }

    .panel {
      background: white;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 20px;
      margin-top: 16px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .panel-header h2,
    .panel-header h3 {
      margin: 0;
    }

    /* TABLE */

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th,
    td {
      text-align: left;
      padding: 12px;
      border-bottom: 1px solid #edf0f4;
      white-space: nowrap;
    }

    th {
      background: #f8fafc;
      color: #64748b;
      font-size: 12px;
      text-transform: uppercase;
    }

    .badge {
      display: inline-block;
      padding: 5px 9px;
      border-radius: 20px;
      background: #eef2ff;
      color: #3730a3;
      font-size: 11px;
      font-weight: 800;
    }

    .badge.green {
      background: #dcfce7;
      color: #166534;
    }

    .badge.red {
      background: #fee2e2;
      color: #991b1b;
    }

    .badge.yellow {
      background: #fef3c7;
      color: #92400e;
    }

    .badge.blue {
      background: #e0f2fe;
      color: #075985;
    }

    /* MODAL */

    .modal {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,.55);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 100;
    }

    .modal.open {
      display: flex;
    }

    .modal-content {
      background: white;
      width: 650px;
      max-width: 100%;
      max-height: 90vh;
      overflow-y: auto;
      border-radius: 16px;
      padding: 25px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .modal-header h2 {
      margin: 0;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .form-full {
      grid-column: 1 / -1;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
    }

    /* PIPELINE */

    .pipeline {
      display: flex;
      gap: 12px;
      overflow-x: auto;
    }

    .pipeline-stage {
      min-width: 190px;
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 10px;
      padding: 12px;
    }

    .deal-card {
      background: white;
      border: 1px solid #e5e7eb;
      padding: 10px;
      border-radius: 9px;
      margin-top: 8px;
    }

    .money {
      color: #059669;
      font-weight: 900;
    }

    .empty {
      text-align: center;
      color: #64748b;
      padding: 30px;
    }

    @media(max-width:900px) {
      .cards {
        grid-template-columns: repeat(2,1fr);
      }
    }

    @media(max-width:700px) {
      .sidebar {
        width: 65px;
      }

      .sidebar-brand,
      .nav-title {
        display: none;
      }

      .nav-button {
        text-align: center;
        padding: 12px 5px;
      }

      .main {
        margin-left: 65px;
        padding: 15px;
      }

      .topbar {
        flex-direction: column;
        align-items: flex-start;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-full {
        grid-column: auto;
      }
    }

    @media(max-width:500px) {
      .cards {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

<!-- ================= AUTH ================= -->

  <div class="auth-card">

      <div>

<script>

"use strict";


/* =========================================================
   SUPABASE
========================================================= */

const supabaseClient =
  supabase.createClient(
    window.SUPABASE_CONFIG.url,
    window.SUPABASE_CONFIG.key
  );


/* =========================================================
   STATE
========================================================= */

let currentUser = null;
let currentProfile = null;
let currentOrganization = null;

const records = {

  leads: [],
  contacts: [],
  accounts: [],
  deals: [],
  activities: [],
  campaigns: []

};


/* =========================================================
   HELPERS
========================================================= */

function $(id) {

  return document.getElementById(id);

}


function escapeHtml(value) {

  return String(value ?? "")
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");

}


function money(value) {

  return new Intl.NumberFormat(
    "en-IN",
    {
      style: "currency",
      currency: "INR",
      maximumFractionDigits: 0
    }
  ).format(Number(value || 0));

}


function showAuthMessage(message, success = false) {

  $("authMessage").innerHTML =
    '<div class="message ' +
    (success ? "success" : "") +
    '">' +
    escapeHtml(message) +
    "</div>";

}


function clearAuthMessage() {

  $("authMessage").innerHTML = "";

}


function showToast(message) {

  alert(message);

}


function badge(status) {

  const s = String(status || "");

  let cls = "";

  if (
    s === "Converted" ||
    s === "Won" ||
    s === "Completed"
  ) {
    cls = "green";
  }

  if (
    s === "Lost" ||
    s === "Not Interested"
  ) {
    cls = "red";
  }

  if (
    s === "Follow-up" ||
    s === "Negotiation"
  ) {
    cls = "yellow";
  }

  if (s === "Contacted") {
    cls = "blue";
  }

  return (
    '<span class="badge ' +
    cls +
    '">' +
    escapeHtml(s || "New") +
    "</span>"
  );

}


/* =========================================================
   AUTHENTICATION
========================================================= */

async function signup() {

  clearAuthMessage();

  const email =
    $("email").value.trim();

  const password =
    $("password").value;

  if (!email) {

    showAuthMessage(
      "Please enter your email address."
    );

    return;

  }

  if (password.length < 6) {

    showAuthMessage(
      "Password must contain at least 6 characters."
    );

    return;

  }

  $("signupButton").disabled = true;

  try {

    const result =
      await supabaseClient.auth.signUp({
        email: email,
        password: password
      });

    if (result.error) {

      showAuthMessage(
        result.error.message
      );

      return;

    }

    /*
      Supabase may require email confirmation.
    */

    if (!result.data.session) {

      showAuthMessage(
        "Account created successfully. Please check your email for confirmation, then sign in.",
        true
      );

      return;

    }

    await initializeApplication(
      result.data.user
    );

  } catch (error) {

    showAuthMessage(
      error.message || "Unable to create account."
    );

  } finally {

    $("signupButton").disabled = false;

  }

}


async function login() {

  clearAuthMessage();

  const email =
    $("email").value.trim();

  const password =
    $("password").value;

  if (!email || !password) {

    showAuthMessage(
      "Please enter your email and password."
    );

    return;

  }

  $("loginButton").disabled = true;

  try {

    const result =
      await supabaseClient.auth.signInWithPassword({
        email: email,
        password: password
      });

    if (result.error) {

      showAuthMessage(
        result.error.message
      );

      return;

    }

    await initializeApplication(
      result.data.user
    );

  } catch (error) {

    showAuthMessage(
      error.message || "Unable to sign in."
    );

  } finally {

    $("loginButton").disabled = false;

  }

}


async function logout() {

  await supabaseClient.auth.signOut();

  window.location.reload();

}


/* =========================================================
   APPLICATION INITIALIZATION
========================================================= */

async function initializeApplication(user) {

  currentUser = user;

  /*
    Load profile.
  */

  let profileResult =
    await supabaseClient
      .from("profiles")
      .select("*")
      .eq("id", user.id)
      .maybeSingle();

  if (profileResult.error) {

    showAuthMessage(
      profileResult.error.message
    );

    return;

  }

  currentProfile =
    profileResult.data;


  /*
    If profile doesn't exist,
    create organization.
  */

  if (
    !currentProfile ||
    !currentProfile.organization_id
  ) {

    const organizationName =
      window.prompt(
        "Welcome to KIP CRM Pro.\n\nEnter your organization/company name:"
      );

    if (!organizationName) {

      showAuthMessage(
        "Organization name is required."
      );

      return;

    }

    const fullName =
      window.prompt(
        "Enter your full name:"
      ) ||
      user.email.split("@")[0];


    /*
      Uses the RPC created in the Supabase schema.
    */

    const rpcResult =
      await supabaseClient.rpc(
        "create_organization",
        {
          org_name: organizationName,
          user_name: fullName
        }
      );

    if (rpcResult.error) {

      showAuthMessage(
        "Organization setup failed: " +
        rpcResult.error.message
      );

      return;

    }


    /*
      Reload profile.
    */

    profileResult =
      await supabaseClient
        .from("profiles")
        .select("*")
        .eq("id", user.id)
        .single();

    if (profileResult.error) {

      showAuthMessage(
        profileResult.error.message
      );

      return;

    }

    currentProfile =
      profileResult.data;

  }


  if (
    !currentProfile ||
    !currentProfile.organization_id
  ) {

    showAuthMessage(
      "Your organization could not be created. Please contact the administrator."
    );

    return;

  }


  /*
    Load organization.
  */

  const organizationResult =
    await supabaseClient
      .from("organizations")
      .select("*")
      .eq(
        "id",
        currentProfile.organization_id
      )
      .single();


  if (organizationResult.error) {

    showAuthMessage(
      organizationResult.error.message
    );

    return;

  }


  currentOrganization =
    organizationResult.data;


  /*
    Show application.
  */

  $("authScreen").classList.add(
    "hidden"
  );

  $("application").classList.remove(
    "hidden"
  );


  $("organizationName").textContent =
    currentOrganization.name;


  $("userName").textContent =
    currentProfile.full_name ||
    user.email;


  /*
    Admin gets Team.
  */

  if (
    currentProfile.role === "admin"
  ) {

    $("teamNavigation")
      .classList.remove("hidden");

  }


  await loadAllRecords();

  showPage("dashboard");

}


/* =========================================================
   DATABASE
========================================================= */

async function loadAllRecords() {

  const tables =
    Object.keys(records);

  for (
    const tableName of tables
  ) {

    const result =
      await supabaseClient
        .from(tableName)
        .select("*")
        .eq(
          "organization_id",
          currentOrganization.id
        )
        .order(
          "created_at",
          {
            ascending: false
          }
        );

    if (result.error) {

      console.error(
        tableName,
        result.error
      );

      records[tableName] = [];

    } else {

      records[tableName] =
        result.data || [];

    }

  }

  renderEverything();

}

  const titles = {

function renderReports() {

  const converted =
    leads.filter(
      lead =>
        String(
          lead.status ||
          ""
        ).toLowerCase() ===
        "converted"

  const revenue =
    deals
      .filter(
        deal =>
          String(
            deal.stage ||
            ""
          ).toLowerCase() ===
          "won"
      )
      .reduce(
        (sum, deal) =>
          sum +
          Number(
            deal.amount || 0

        0

  $("reportCards").innerHTML = `

    <div class="card">
      <div class="card-label">
        Total Leads

        Conversion Rate

      <div class="card-label">
        Won Revenue
      </div>

    </div>

  `;


  const statuses = {};

  leads.forEach(

        "New";

      statuses[status] =
        (statuses[status] || 0) +
        1;

  $("leadStatusReport").innerHTML =

    return `

      </div>
    `;

  }


  return `

    <div class="table-container">

      <table>

        <thead>

          <tr>

            ${headers.map(
              header =>
                `<th>${header}</th>`
            ).join("")}

          </tr>

        </thead>

        <tbody>

          ${rows.map(
            row => `

            <tr>

              ${row.map(
                cell =>
                  `<td>${cell}</td>`
              ).join("")}

            </tr>

          `).join("")}

        </tbody>

      </table>

    </div>

  `;

}

function openForm(type) {

  const definition =
    formDefinitions[type];


  if (!definition) {

    return;

  }


  $("modalTitle").textContent =
    definition.title;


  $("modalBody").innerHTML =
    `
    <div class="form-grid">

      ${definition.fields.map(
        field => {

          let element = "";

          if (
            field.type ===
            "select"
          ) {

            element = `

              <select
                id="form-${field.name}"
                class="input"
              >

                ${field.options.map(
                  option =>
                    `<option value="${escapeHtml(option)}">${escapeHtml(option)}</option>`
                ).join("")}

              </select>

            `;

          } else if (
            field.type ===
            "textarea"
          ) {

            element = `

              <textarea
                id="form-${field.name}"
                class="input"
                rows="4"
                placeholder="${escapeHtml(field.label)}"
              ></textarea>

            `;

          } else {

            element = `

              <input
                id="form-${field.name}"
                class="input"
                type="${field.type || "text"}"
                placeholder="${escapeHtml(field.label)}"
              >

            `;

          }


          return `

            <div class="${
              field.full
                ? "form-full"
                : ""
            }">

              <label>
                <strong>
                  ${escapeHtml(
                    field.label
                  )}
                  ${
                    field.required
                      ? " *"
                      : ""
                  }
                </strong>
              </label>

              ${element}

            </div>

          `;

        }
      ).join("")}

    </div>
    `;


  $("modal").classList.add(
    "open"
  );


  $("modalSave").onclick =
    () =>
      saveForm(
        definition
      );

}


function closeModal() {

  $("modal").classList.remove(
    "open"
  );

}


async function saveForm(
  definition
) {

  const data = {};


  for (
    const field
    of definition.fields
  ) {

    const input =
      $(
        "form-" +
        field.name
      );


    const value =
      input.value.trim();


    if (
      field.required &&
      !value
    ) {

      showToast(
        field.label +
        " is required."
      );

      input.focus();

      return;

    }


    data[field.name] =
      value || null;

  }


  data.organization_id =
    currentOrganization.id;


  /*
    Add current user when supported.
  */

  if (
    definition.table ===
    "leads"
  ) {

    data.owner_id =
      currentUser.id;

  }


  if (
    definition.table ===
    "contacts"
  ) {

    data.owner_id =
      currentUser.id;

  }


  if (
    definition.table ===
    "accounts"
  ) {

    data.owner_id =
      currentUser.id;

  }


  if (
    definition.table ===
    "deals"
  ) {

    data.owner_id =
      currentUser.id;

  }


  const result =
    await supabaseClient
      .from(
        definition.table
      )
      .insert(data);


  if (result.error) {

    showToast(
      result.error.message
    );

    console.error(
      result.error
    );

    return;

  }


  closeModal();

  showToast(
    definition.title +
    " created successfully."
  );


  await loadAllRecords();

}
