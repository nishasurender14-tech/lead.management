<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIP Financial CRM V4</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase/config.js"></script><style>
:root{--nav:#0b1736;--blue:#1769e0;--bg:#f5f7fb;--line:#e4e7ec;--text:#101828;--muted:#667085}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#07142f,#1769e0)}.authbox{width:min(430px,92vw);background:#fff;padding:34px;border-radius:20px;box-shadow:0 25px 80px #0005}.brand{font-weight:900;color:var(--blue);letter-spacing:.4px}.field{width:100%;padding:11px 12px;border:1px solid #d0d5dd;border-radius:9px;margin:6px 0;background:#fff}.btn{border:1px solid #d0d5dd;background:#fff;border-radius:8px;padding:9px 13px;cursor:pointer;font-weight:700}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.btn.danger{color:#b42318}.shell{min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:245px;background:var(--nav);color:#dbe5f2;padding:18px 12px;overflow:auto}.side h2{color:#fff;margin:4px 10px 24px}.section{font-size:11px;text-transform:uppercase;color:#8192aa;font-weight:800;margin:18px 10px 7px}.nav{display:block;width:100%;border:0;background:none;color:#cbd5e1;text-align:left;padding:10px 12px;border-radius:8px;cursor:pointer}.nav:hover,.nav.active{background:#173557;color:#fff}.main{margin-left:245px}.top{height:68px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.content{padding:22px;max-width:1700px;margin:auto}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:16px}.search{min-width:280px;padding:10px 12px;border:1px solid #d0d5dd;border-radius:8px}.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:14px}.card,.panel{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px;margin-bottom:16px}.metric{font-size:25px;font-weight:850;margin-top:7px}.muted{color:var(--muted)}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px;border-bottom:1px solid #eef1f4;text-align:left;white-space:nowrap}th{font-size:11px;color:#667085;text-transform:uppercase}tr.click{cursor:pointer}tr.click:hover td{background:#fafbfd}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:#eef4ff;color:#245bb3;font-size:12px;font-weight:700}.empty{text-align:center;padding:45px;color:#667085}.kanban{display:flex;gap:12px;overflow:auto}.stage{min-width:230px;background:#eef1f5;padding:11px;border-radius:11px}.deal{background:#fff;border:1px solid var(--line);padding:11px;border-radius:9px;margin-top:8px}.modal{position:fixed;inset:0;background:#0008;display:none;place-items:center;z-index:50}.modal.open{display:grid}.modalbox{width:min(780px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:15px;padding:21px}.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.record{display:grid;grid-template-columns:280px 1fr 300px;gap:16px}.timeline{border-left:2px solid #e5e7eb;padding-left:17px}.item{padding:11px 0;border-bottom:1px solid #eee}.toast{position:fixed;right:20px;bottom:20px;background:#101828;color:#fff;padding:12px 16px;border-radius:9px;display:none;z-index:100}.toast.show{display:block}@media(max-width:1050px){.side{width:70px}.side h2,.side span,.section{display:none}.main{margin-left:70px}.cards{grid-template-columns:repeat(2,1fr)}.record{grid-template-columns:1fr}.form{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:600px){.cards{grid-template-columns:1fr}.content{padding:13px}.search{min-width:180px}}
</style></head><body>
<div id="auth" class="auth"><div class="authbox"><div class="brand">KIP FINANCIAL</div><h1>CRM V4</h1><p class="muted">Customer, sales, consultancy and project management.</p><div id="authmsg"></div><input id="email" class="field" type="email" placeholder="Work email"><input id="password" class="field" type="password" placeholder="Password"><button class="btn primary" style="width:100%;margin-top:8px" onclick="signIn()">Sign in</button><button class="btn" style="width:100%;margin-top:8px" onclick="signUp()">Create account</button></div></div>
<div id="app" class="shell hidden"><aside class="side"><h2>KIP FINANCIAL</h2><div class="section">Workspace</div><button class="nav active" data-page="dashboard">⌂ <span>Dashboard</span></button><div class="section">CRM</div><button class="nav" data-page="contacts">◉ <span>Contacts</span></button><button class="nav" data-page="companies">▣ <span>Companies</span></button><button class="nav" data-page="leads">◈ <span>Leads</span></button><button class="nav" data-page="deals">◆ <span>Deals</span></button><button class="nav" data-page="tickets">▤ <span>Tickets</span></button><button class="nav" data-page="activities">◷ <span>Activities</span></button><div class="section">KIP Business</div><button class="nav" data-page="projects">▥ <span>Projects</span></button><button class="nav" data-page="tenders">◇ <span>Tenders</span></button><button class="nav" data-page="applications">▧ <span>Applications</span></button><button class="nav" data-page="schemes">◎ <span>Schemes & Subsidies</span></button><button class="nav" data-page="registrations">◫ <span>Registrations</span></button><button class="nav" data-page="documents">□ <span>Documents</span></button><div class="section">Revenue</div><button class="nav" data-page="services">▤ <span>Services</span></button><button class="nav" data-page="quotes">₹ <span>Quotes</span></button><button class="nav" data-page="invoices">₹ <span>Invoices</span></button><button class="nav" data-page="payments">₹ <span>Payments</span></button><div class="section">Marketing & Analytics</div><button class="nav" data-page="campaigns">◉ <span>Campaigns</span></button><button class="nav" data-page="reports">▥ <span>Reports</span></button><button class="nav" data-page="forecast">↗ <span>Forecast</span></button><div class="section">Administration</div><button class="nav" data-page="team">♟ <span>Users & Teams</span></button><button class="nav" data-page="settings">⚙ <span>Settings</span></button><button class="nav" onclick="signOut()">↪ <span>Sign out</span></button></aside><main class="main"><header class="top"><div><h2 id="title" style="margin:0">Dashboard</h2><small id="org" class="muted"></small></div><div id="action"></div></header><div id="content" class="content"></div></main></div>
<div id="modal" class="modal"><div class="modalbox"><div style="display:flex;justify-content:space-between;align-items:center"><h3 id="modalTitle">Create</h3><button class="btn" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><div id="toast" class="toast"></div>
<script>
const sb=supabase.createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.key);let user=null,profile=null,organization=null,current='dashboard',cache=[];
const modules={contacts:['Contacts','Contact'],companies:['Companies','Company'],leads:['Leads','Lead'],deals:['Deals','Deal'],tickets:['Tickets','Ticket'],activities:['Activities','Activity'],projects:['Projects','Project'],tenders:['Tenders','Tender'],applications:['Applications','Application'],schemes:['Schemes & Subsidies','Scheme'],registrations:['Registrations','Registration'],documents:['Documents','Document'],services:['Services','Service'],quotes:['Quotes','Quote'],invoices:['Invoices','Invoice'],payments:['Payments','Payment'],campaigns:['Campaigns','Campaign']};
const fields={contacts:[['name','Full name'],['email','Email'],['phone','Phone'],['company','Company'],['job_title','Job title'],['owner','Owner']],companies:[['name','Company name'],['industry','Industry'],['phone','Phone'],['website','Website'],['location','Location'],['owner','Owner']],leads:[['name','Lead name'],['company','Company'],['email','Email'],['phone','Phone'],['status','Status'],['source','Lead source'],['owner','Owner'],['next_follow_up','Next follow-up']],deals:[['name','Deal name'],['amount','Amount'],['stage','Stage'],['close_date','Close date'],['owner','Owner']],tickets:[['name','Ticket title'],['status','Status'],['priority','Priority'],['owner','Owner'],['description','Description']],projects:[['name','Project name'],['status','Status'],['value','Project value'],['owner','Owner'],['description','Description']],tenders:[['name','Tender title'],['tender_id','Tender ID'],['authority','Authority'],['state','State'],['value','Tender value'],['closing_date','Closing date'],['status','Status'],['owner','Owner']],applications:[['name','Application'],['application_no','Application No.'],['client','Client'],['scheme','Scheme'],['status','Status'],['submission_date','Submission date'],['owner','Owner']],schemes:[['name','Scheme name'],['department','Department'],['state','State'],['industry','Industry'],['subsidy','Subsidy / Incentive'],['status','Status']],registrations:[['name','Registration type'],['client','Client'],['authority','Authority'],['registration_no','Registration No.'],['status','Status'],['expiry_date','Expiry date'],['owner','Owner']],documents:[['name','Document name'],['document_type','Document type'],['status','Verification status'],['expiry_date','Expiry date'],['owner','Owner']],services:[['name','Service name'],['category','Category'],['price','Price'],['status','Status']],quotes:[['name','Quote number / title'],['amount','Amount'],['status','Status'],['valid_until','Valid until'],['owner','Owner']],invoices:[['name','Invoice number'],['amount','Amount'],['status','Status'],['due_date','Due date'],['owner','Owner']],payments:[['name','Payment reference'],['amount','Amount'],['status','Status'],['payment_date','Payment date']],campaigns:[['name','Campaign name'],['channel','Channel'],['budget','Budget'],['status','Status'],['start_date','Start date'],['end_date','End date']]};
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=v=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(v||0));function toast(t){toastEl=document.getElementById('toast');toastEl.textContent=t;toastEl.classList.add('show');setTimeout(()=>toastEl.classList.remove('show'),2500)}function authMsg(t){document.getElementById('authmsg').innerHTML='<div style="color:#b42318;margin:8px 0">'+esc(t)+'</div>'}
async function signIn(){let r=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error)return authMsg(r.error.message);boot(r.data.user)}async function signUp(){let r=await sb.auth.signUp({email:email.value.trim(),password:password.value});if(r.error)return authMsg(r.error.message);if(!r.data.session)return authMsg('Account created. Confirm your email, then sign in.');boot(r.data.user)}async function signOut(){await sb.auth.signOut();location.reload()}
async function boot(u){user=u;let r=await sb.from('kip4_profiles').select('*').eq('id',u.id).maybeSingle();profile=r.data;if(!profile){let name=prompt('Your full name')||u.email.split('@')[0],orgName=prompt('Organization name')||'KIP Financial';r=await sb.rpc('kip4_create_org',{org_name:orgName,user_name:name});if(r.error)return authMsg(r.error.message);r=await sb.from('kip4_profiles').select('*').eq('id',u.id).single();profile=r.data}r=await sb.from('kip4_organizations').select('*').eq('id',profile.organization_id).single();if(r.error)return authMsg(r.error.message);organization=r.data;document.getElementById('auth').classList.add('hidden');document.getElementById('app').classList.remove('hidden');document.getElementById('org').textContent=organization.name;go('dashboard')}
async function get(type){let r=await sb.from('kip4_records').select('*').eq('organization_id',organization.id).eq('object_type',type).order('created_at',{ascending:false});return r.data||[]}
function go(page){current=page;document.querySelectorAll('.nav[data-page]').forEach(b=>b.classList.toggle('active',b.dataset.page===page));document.getElementById('title').textContent=page==='dashboard'?'Dashboard':modules[page]?.[0]||({reports:'Reports',forecast:'Forecast',team:'Users & Teams',settings:'Settings'}[page]||page);renderAction();render()}
function renderAction(){let el=document.getElementById('action');el.innerHTML='';if(modules[current]){let b=document.createElement('button');b.className='btn primary';b.textContent='+ New '+modules[current][1];b.onclick=()=>create(current);el.appendChild(b)}else if(current==='team'){let b=document.createElement('button');b.className='btn primary';b.textContent='+ Invite User';b.onclick=invite;el.appendChild(b)}else if(current==='activities'){let b=document.createElement('button');b.className='btn primary';b.textContent='+ New Activity';b.onclick=createActivity;el.appendChild(b)}}
async function render(){if(current==='dashboard')return dashboard();if(modules[current])return list(current);if(current==='reports')return reports();if(current==='forecast')return forecast();if(current==='team')return team();if(current==='settings')return settings()}
async function dashboard(){let [l,c,d,p,a]=await Promise.all([get('leads'),get('contacts'),get('deals'),get('projects'),sb.from('kip4_activities').select('*').eq('organization_id',organization.id).order('created_at',{ascending:false}).limit(8)]);let pipeline=d.reduce((n,x)=>n+Number(x.properties?.amount||0),0),won=d.filter(x=>x.properties?.stage==='Closed Won').reduce((n,x)=>n+Number(x.properties?.amount||0),0);document.getElementById('content').innerHTML='<div class="cards">'+[['Leads',l.length],['Contacts',c.length],['Open Deals',d.filter(x=>!['Closed Won','Closed Lost'].includes(x.properties?.stage)).length],['Pipeline',money(pipeline)],['Projects',p.length]].map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><div class="metric">'+x[1]+'</div></div>').join('')+'</div><div class="panel"><h3>Revenue</h3><p>Won revenue: <b>'+money(won)+'</b></p></div><div class="panel"><h3>Recent activity</h3>'+((a.data||[]).map(x=>'<div style="padding:10px 0;border-bottom:1px solid #eee"><b>'+esc(x.subject)+'</b><span class="muted"> · '+esc(x.activity_type)+' · '+esc(x.status)+'</span></div>').join('')||'<div class="empty">No activity yet.</div>')+'</div>'}
async function list(page){cache=await get(modules[page][1].toLowerCase()+'s');let search='<input class="search" placeholder="Search '+modules[page][0]+'..." oninput="filterRows(this.value)">';document.getElementById('content').innerHTML='<div class="toolbar">'+search+'<span class="muted">'+cache.length+' records</span></div><div class="panel"><div id="table"></div></div>';draw(cache,page)}
function filterRows(q){let x=cache.filter(r=>JSON.stringify(r.properties||{}).toLowerCase().includes(q.toLowerCase()));draw(x,current)}
function draw(rows,page){let el=document.getElementById('table');if(!rows.length){el.innerHTML='<div class="empty">No records found.<br><br><button class="btn primary" onclick="create(\''+page+'\')">+ New '+modules[page][1]+'</button></div>';return}let keys=fields[page]||[['name','Name'],['status','Status'],['owner','Owner']];let cols=keys.slice(0,5);el.innerHTML='<div class="tablewrap"><table><thead><tr>'+cols.map(x=>'<th>'+x[1]+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>{let p=r.properties||{};return '<tr class="click" onclick="record(\''+r.id+'\')">'+cols.map((x,i)=>'<td class="'+(i===0?'link':'')+'">'+esc(p[x[0]]||'—')+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div>'}
function inputField(k,label,type='text'){let t=type;if(k.includes('date'))t='date';if(['amount','value','price','budget','subsidy'].includes(k))t='number';return '<div class="'+(k==='description'||k==='notes'?'full':'')+'"><label class="muted">'+esc(label)+'</label><input id="f_'+esc(k)+'" class="field" type="'+t+'" placeholder="'+esc(label)+'"></div>'}
function create(page){let fs=fields[page]||[['name','Name'],['status','Status']];document.getElementById('modalTitle').textContent='New '+modules[page][1];document.getElementById('modalBody').innerHTML='<div class="form">'+fs.map(x=>inputField(x[0],x[1])).join('')+'</div><div style="text-align:right;margin-top:15px"><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="save(\''+page+'\')">Save</button></div>';document.getElementById('modal').classList.add('open')}
async function save(page){let p={};(fields[page]||[]).forEach(x=>{let e=document.getElementById('f_'+x[0]);if(e&&e.value)p[x[0]]=e.value});if(!p.name)return alert('Name is required');let r=await sb.from('kip4_records').insert({organization_id:organization.id,object_type:modules[page][1].toLowerCase()+'s',properties:p,owner_id:user.id}).select().single();if(r.error)return alert(r.error.message);closeModal();toast('Created successfully');render()}
async function record(id){let r=await sb.from('kip4_records').select('*').eq('id',id).single();if(r.error)return alert(r.error.message);let a=await sb.from('kip4_associations').select('*').or('from_record_id.eq.'+id+',to_record_id.eq.'+id);let acts=await sb.from('kip4_activities').select('*').eq('organization_id',organization.id).order('created_at',{ascending:false}).limit(30);let p=r.data.properties||{};document.getElementById('modalTitle').textContent=p.name||'Record';document.getElementById('modalBody').innerHTML='<div class="record"><div class="panel"><h3>Properties</h3>'+Object.entries(p).map(([k,v])=>'<p><span class="muted">'+esc(k)+'</span><br><b>'+esc(v)+'</b></p>').join('')+'</div><div class="panel"><h3>Activity timeline</h3>'+((acts.data||[]).filter(x=>x.subject).map(x=>'<div class="item"><b>'+esc(x.subject)+'</b><br><span class="muted">'+esc(x.activity_type)+' · '+esc(x.status)+'</span></div>').join('')||'<div class="empty">No activities.</div>')+'</div><div class="panel"><h3>Associations</h3>'+((a.data||[]).map(x=>'<p><span class="badge">'+esc(x.label||'Associated')+'</span></p>').join('')||'<div class="muted">No associations yet.</div>')+'</div></div><div style="text-align:right;margin-top:15px"><button class="btn" onclick="closeModal()">Close</button></div>';document.getElementById('modal').classList.add('open')}
function createActivity(){document.getElementById('modalTitle').textContent='New Activity';document.getElementById('modalBody').innerHTML='<div class="form"><div><label class="muted">Type</label><select id="a_type" class="field"><option>Call</option><option>Email</option><option>Meeting</option><option>Task</option><option>Note</option><option>WhatsApp</option></select></div><div><label class="muted">Status</label><select id="a_status" class="field"><option>Open</option><option>Completed</option><option>Pending</option></select></div><input id="a_subject" class="field full" placeholder="Subject"><input id="a_due" class="field" type="datetime-local"><textarea id="a_body" class="field full" placeholder="Details"></textarea></div><div style="text-align:right;margin-top:15px"><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="saveActivity()">Save</button></div>';document.getElementById('modal').classList.add('open')}
async function saveActivity(){let r=await sb.from('kip4_activities').insert({organization_id:organization.id,activity_type:a_type.value,subject:a_subject.value,body:a_body.value,due_at:a_due.value||null,status:a_status.value,owner_id:user.id,created_by:user.id});if(r.error)return alert(r.error.message);closeModal();toast('Activity created');render()}
async function reports(){let [l,d,p]=await Promise.all([get('leads'),get('deals'),get('projects')]);let conv=l.filter(x=>x.properties?.status==='Converted').length;document.getElementById('content').innerHTML='<div class="cards">'+[['Leads',l.length],['Conversion',l.length?Math.round(conv/l.length*100)+'%':'0%'],['Deal Value',money(d.reduce((n,x)=>n+Number(x.properties?.amount||0),0))],['Projects',p.length],['Won Deals',d.filter(x=>x.properties?.stage==='Closed Won').length]].map(x=>'<div class="card"><span class="muted">'+x[0]+'</span><div class="metric">'+x[1]+'</div></div>').join('')+'</div><div class="panel"><h3>Lead sources</h3>'+sourceRows(l)+'</div>'}function sourceRows(l){let m={};l.forEach(x=>{let s=x.properties?.source||'Unknown';m[s]=(m[s]||0)+1});return Object.entries(m).map(x=>'<p><b>'+esc(x[0])+'</b> — '+x[1]+'</p>').join('')||'<div class="empty">No data.</div>'}
async function forecast(){let d=await get('deals'),st=['New','Qualification','Needs Analysis','Proposal','Negotiation','Closed Won','Closed Lost'];document.getElementById('content').innerHTML='<div class="panel"><h3>Deal forecast</h3><div class="kanban">'+st.map(s=>'<div class="stage"><b>'+s+'</b>'+d.filter(x=>x.properties?.stage===s).map(x=>'<div class="deal"><b>'+esc(x.properties?.name)+'</b><br>'+money(x.properties?.amount)+'</div>').join('')+'</div>').join('')+'</div></div>'}
async function team(){let r=await sb.from('kip4_profiles').select('id,full_name,role,created_at').eq('organization_id',organization.id);document.getElementById('content').innerHTML='<div class="panel"><h3>Users & Teams</h3>'+((r.data||[]).length?'<div class="tablewrap"><table><thead><tr><th>Name</th><th>Role</th><th>Created</th></tr></thead><tbody>'+(r.data||[]).map(x=>'<tr><td>'+esc(x.full_name||'—')+'</td><td><span class="badge">'+esc(x.role)+'</span></td><td>'+new Date(x.created_at).toLocaleDateString('en-IN')+'</td></tr>').join('')+'</tbody></table></div>':'<div class="empty">No team members.</div>')+'</div>'}function invite(){alert('User invitations require Supabase Auth email configuration. The team table is ready for it.')}function settings(){document.getElementById('content').innerHTML='<div class="panel"><h3>CRM Settings</h3><p>V4 uses configurable properties, pipelines, associations and organization-level data.</p><p class="muted">Advanced property and workflow editors are connected to the V4 database foundation and can be expanded without changing the record model.</p></div>'}function closeModal(){document.getElementById('modal').classList.remove('open')}document.querySelectorAll('.nav[data-page]').forEach(b=>b.onclick=()=>go(b.dataset.page));sb.auth.getSession().then(r=>{if(r.data.session)boot(r.data.session.user)});
</script></body></html>
