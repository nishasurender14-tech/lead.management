<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>KIP Financial CRM</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="supabase/config.js"></script><style>*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f6f8fb;color:#182230}button,input,select,textarea{font:inherit}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0b1736,#123c76)}.authbox{width:min(430px,92vw);background:#fff;border-radius:22px;padding:34px;box-shadow:0 25px 80px #0005}.brand{font-weight:900;color:#1769e0;letter-spacing:-.5px}.authbox h1{margin:6px 0}.field{width:100%;border:1px solid #d9e0ea;border-radius:10px;padding:12px;margin:6px 0;background:#fff}.btn{border:1px solid #d7dee8;background:#fff;border-radius:9px;padding:10px 14px;cursor:pointer;font-weight:700}.btn.primary{background:#1769e0;color:#fff;border-color:#1769e0}.btn.danger{color:#b42318}.shell{display:flex;min-height:100vh}.side{width:245px;background:#0d1b2a;color:#dbe6f5;position:fixed;inset:0 auto 0 0;padding:20px 14px;overflow:auto}.side h2{margin:0 10px 24px;color:#fff}.section{font-size:11px;text-transform:uppercase;color:#7f92aa;margin:20px 10px 7px;font-weight:800}.nav{width:100%;border:0;background:none;color:#cbd5e1;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer}.nav:hover,.nav.active{background:#173557;color:#fff}.main{margin-left:245px;width:calc(100% - 245px)}.top{height:70px;background:#fff;border-bottom:1px solid #e4e9f0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.title h1{font-size:20px;margin:0}.content{padding:24px;max-width:1600px;margin:auto}.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:18px}.search{min-width:280px;border:1px solid #d9e0ea;border-radius:9px;padding:10px 12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:15px;margin-bottom:20px}.card{background:#fff;border:1px solid #e5eaf0;border-radius:14px;padding:18px}.metric{font-size:27px;font-weight:850;margin-top:8px}.muted{color:#667085}.panel{background:#fff;border:1px solid #e5eaf0;border-radius:14px;padding:18px;margin-bottom:18px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:12px 10px;border-bottom:1px solid #eef1f5;text-align:left;white-space:nowrap}th{font-size:12px;color:#667085;text-transform:uppercase}tr:hover td{background:#fafbfd}.badge{display:inline-block;padding:4px 9px;border-radius:99px;background:#eef4ff;color:#245bb3;font-size:12px;font-weight:700}.empty{padding:45px;text-align:center;color:#667085}.modal{position:fixed;inset:0;background:#0b122099;display:none;place-items:center;z-index:30}.modal.open{display:grid}.modalbox{width:min(760px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.record{display:grid;grid-template-columns:280px 1fr 280px;gap:18px}.timeline{border-left:2px solid #e5e7eb;padding-left:18px}.activity{padding:12px 0;border-bottom:1px solid #eee}.kanban{display:flex;gap:14px;overflow:auto}.stage{min-width:230px;background:#f1f4f8;border-radius:12px;padding:12px}.deal{background:#fff;padding:12px;border-radius:10px;margin-top:9px;border:1px solid #e5eaf0}.link{color:#1769e0;cursor:pointer;font-weight:700}.notice{padding:12px;border-radius:10px;background:#fff8e6;color:#8a5b00;margin-bottom:14px}@media(max-width:1000px){.side{width:70px}.side span,.section,.side h2{display:none}.main{margin-left:70px;width:calc(100% - 70px)}.cards{grid-template-columns:1fr 1fr}.record{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:600px){.cards{grid-template-columns:1fr}.search{min-width:180px}.content{padding:14px}}
</style></head><body><div id="auth" class="auth"><div class="authbox"><div class="brand">KIP FINANCIAL</div><h1>CRM</h1><p class="muted">Secure customer, sales and project management.</p><div id="authmsg"></div><input id="email" class="field" type="email" placeholder="Work email"><input id="password" class="field" type="password" placeholder="Password"><button class="btn primary" style="width:100%;margin-top:8px" onclick="login()">Sign in</button><button class="btn" style="width:100%;margin-top:8px" onclick="signup()">Create account</button></div></div><div id="app" class="shell hidden"><aside class="side"><h2>KIP FINANCIAL</h2><div class="section">Workspace</div><button class="nav active" data-page="dashboard">⌂ <span>Dashboard</span></button><div class="section">CRM</div><button class="nav" data-page="contacts">◉ <span>Contacts</span></button><button class="nav" data-page="companies">▣ <span>Companies</span></button><button class="nav" data-page="leads">◈ <span>Leads</span></button><button class="nav" data-page="deals">◆ <span>Deals</span></button><button class="nav" data-page="tickets">▤ <span>Tickets</span></button><button class="nav" data-page="activities">◷ <span>Activities</span></button><div class="section">KIP Business</div><button class="nav" data-page="projects">▥ <span>Projects</span></button><button class="nav" data-page="tenders">◇ <span>Tenders</span></button><button class="nav" data-page="applications">▧ <span>Applications</span></button><button class="nav" data-page="schemes">◎ <span>Schemes & Subsidies</span></button><button class="nav" data-page="registrations">◫ <span>Registrations</span></button><button class="nav" data-page="documents">□ <span>Documents</span></button><div class="section">Revenue</div><button class="nav" data-page="services">▤ <span>Services</span></button><button class="nav" data-page="quotes">₹ <span>Quotes</span></button><button class="nav" data-page="invoices">₹ <span>Invoices</span></button><button class="nav" data-page="payments">₹ <span>Payments</span></button><div class="section">Marketing & Analytics</div><button class="nav" data-page="campaigns">◉ <span>Campaigns</span></button><button class="nav" data-page="reports">▥ <span>Reports</span></button><button class="nav" data-page="forecast">↗ <span>Forecast</span></button><div class="section">Admin</div><button class="nav" data-page="team">♟ <span>Users & Teams</span></button><button class="nav" data-page="settings">⚙ <span>Settings</span></button><button class="nav" onclick="logout()">↪ <span>Sign out</span></button></aside><main class="main"><header class="top"><div class="title"><h1 id="pageTitle">Dashboard</h1><small id="orgLabel" class="muted"></small></div><div id="action"></div></header><div id="content" class="content"></div></main></div><div id="modal" class="modal"><div class="modalbox"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="modalTitle">Create</h2><button class="btn" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div><script>const sb=supabase.createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.key);let session=null,org=null,profile=null,current='dashboard',records=[];const objectMap={contacts:['Contacts','Contact'],companies:['Companies','Company'],leads:['Leads','Lead'],deals:['Deals','Deal'],tickets:['Tickets','Ticket'],projects:['Projects','Project'],tenders:['Tenders','Tender'],applications:['Applications','Application'],schemes:['Schemes & Subsidies','Scheme'],registrations:['Registrations','Registration'],documents:['Documents','Document'],services:['Services','Service'],quotes:['Quotes','Quote'],invoices:['Invoices','Invoice'],payments:['Payments','Payment'],campaigns:['Campaigns','Campaign'],activities:['Activities','Activity']};const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(n||0));function authError(x){authmsg.innerHTML='<div class="notice">'+esc(x)+'</div>'}async function login(){let r=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error)return authError(r.error.message);start(r.data.session)}async function signup(){let r=await sb.auth.signUp({email:email.value.trim(),password:password.value});if(r.error)return authError(r.error.message);if(!r.data.session)return authError('Account created. Confirm your email, then sign in.');start(r.data.session)}async function logout(){await sb.auth.signOut();location.reload()}async function start(s){session=s;let r=await sb.from('kip4_profiles').select('*').eq('id',s.user.id).maybeSingle();profile=r.data;if(!profile){let name=prompt('Your full name')||s.user.email.split('@')[0];let orgname=prompt('Organization name')||'KIP Financial';r=await sb.rpc('kip4_create_org',{org_name:orgname,user_name:name});if(r.error)return authError(r.error.message);r=await sb.from('kip4_profiles').select('*').eq('id',s.user.id).single();profile=r.data}r=await sb.from('kip4_organizations').select('*').eq('id',profile.organization_id).single();org=r.data;auth.classList.add('hidden');app.classList.remove('hidden');orgLabel.textContent=org?.name||'KIP Financial';navigate('dashboard')}async function getRecords(type){if(!org)return[];let r=await sb.from('kip4_records').select('*').eq('organization_id',org.id).eq('object_type',type).order('created_at',{ascending:false});return r.data||[]}function navigate(page){current=page;document.querySelectorAll('.nav[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));pageTitle.textContent=page==='dashboard'?'Dashboard':objectMap[page]?.[0]||({reports:'Reports',forecast:'Forecast',team:'Users & Teams',settings:'Settings'}[page]||page);renderAction();renderPage()}function renderAction(){action.innerHTML='';if(objectMap[current]&&current!=='activities'){action.innerHTML='<button class="btn primary" onclick="createRecord(\''+current+'\')">+ New '+esc(objectMap[current][1])+'</button>'}else if(current==='activities'){action.innerHTML='<button class="btn primary" onclick="createActivity()">+ New Activity</button>'}else if(current==='team'){action.innerHTML='<button class="btn primary" onclick="inviteUser()">+ Invite User</button>'}}async function renderPage(){if(current==='dashboard')return renderDashboard();if(objectMap[current])return renderObject(current);if(current==='reports')return renderReports();if(current==='forecast')return renderForecast();if(current==='team')return renderTeam();if(current==='settings')return renderSettings()}async function renderDashboard(){let [l,c,d,t]=await Promise.all([getRecords('leads'),getRecords('contacts'),getRecords('deals'),getRecords('tickets')]);let pipeline=d.reduce((a,x)=>a+Number(x.properties?.amount||0),0),won=d.filter(x=>x.properties?.stage==='Closed Won').reduce((a,x)=>a+Number(x.properties?.amount||0),0);content.innerHTML='<div class="cards">'+[['Leads',l.length],['Contacts',c.length],['Open Deals',d.filter(x=>!['Closed Won','Closed Lost'].includes(x.properties?.stage)).length],['Pipeline',money(pipeline)]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="metric">'+x[1]+'</div></div>').join('')+'</div><div class="panel"><h3>Sales overview</h3><p class="muted">Won revenue: <b>'+money(won)+'</b> · Tickets: <b>'+t.length+'</b></p></div><div class="panel"><h3>Quick actions</h3><div class="toolbar"><button class="btn" onclick="navigate(\'leads\')">Manage Leads</button><button class="btn" onclick="navigate(\'contacts\')">Manage Contacts</button><button class="btn" onclick="navigate(\'deals\')">Open Pipeline</button><button class="btn" onclick="navigate(\'projects\')">Projects</button></div></div>'}async function renderObject(page){records=await getRecords(page);let q=page==='deals'?'<input class="search" placeholder="Search deals..." oninput="filterTable(this.value)">':'<input class="search" placeholder="Search '+objectMap[page][0]+'..." oninput="filterTable(this.value)">';content.innerHTML='<div class="toolbar">'+q+'<span class="muted">'+records.length+' records</span></div><div class="panel"><div id="table"></div></div>';drawTable(records,page)}function drawTable(data,page){if(!data.length){table.innerHTML='<div class="empty">No '+objectMap[page][0].toLowerCase()+' yet.<br><br><button class="btn primary" onclick="createRecord(\''+page+'\')">Create first '+objectMap[page][1]+'</button></div>';return}let cols=page==='contacts'?['Name','Email','Phone','Company','Owner']:page==='companies'?['Company','Industry','Phone','Website','Owner']:page==='deals'?['Deal','Stage','Amount','Close Date','Owner']:['Name','Status','Source','Owner','Created'];table.innerHTML='<div class="tablewrap"><table><thead><tr>'+cols.map(x=>'<th>'+x+'</th>').join('')+'</tr></thead><tbody>'+data.map(r=>{let p=r.properties||{};let vals=page==='contacts'?[p.name,p.email,p.phone,p.company,p.owner]:page==='companies'?[p.name,p.industry,p.phone,p.website,p.owner]:page==='deals'?[p.name,p.stage,money(p.amount),p.close_date,p.owner]:[p.name,p.status,p.source,p.owner,new Date(r.created_at).toLocaleDateString('en-IN')];return '<tr onclick="openRecord(\''+r.id+'\')">'+vals.map((v,i)=>'<td class="'+(i===0?'link':'')+'">'+esc(v||'—')+'</td>').join('')+'</tr>'}).join('')+'</tbody></table></div>'}function filterTable(q){let x=records.filter(r=>JSON.stringify(r.properties||{}).toLowerCase().includes(q.toLowerCase()));drawTable(x,current)}function createRecord(page){let singular=objectMap[page][1];let fields=page==='contacts'?[['name','Full name'],['email','Email'],['phone','Phone'],['company','Company'],['job_title','Job title'],['owner','Owner']]:page==='companies'?[['name','Company name'],['industry','Industry'],['phone','Phone'],['website','Website'],['owner','Owner']]:page==='deals'?[['name','Deal name'],['amount','Amount'],['stage','Stage'],['close_date','Close date'],['owner','Owner']]:[['name','Name / Title'],['status','Status'],['source','Source'],['owner','Owner'],['notes','Notes']];modalTitle.textContent='New '+singular;modalBody.innerHTML='<div class="formgrid">'+fields.map(f=>'<label>'+esc(f[1])+(f[0]==='name'?' *':'')+'<input id="f_'+f[0]+'" class="field" '+(f[0]==='amount'?'type="number"':'')+'></label>').join('')+'</div><div style="text-align:right;margin-top:16px"><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="saveRecord(\''+page+'\')">Create '+singular+'</button></div>';modal.classList.add('open')}async function saveRecord(page){let props={};document.querySelectorAll('#modalBody input').forEach(x=>props[x.id.replace('f_','')]=x.value);if(!props.name?.trim())return alert('Name is required');let r=await sb.from('kip4_records').insert({organization_id:org.id,object_type:page,properties:props,owner_id:session.user.id}).select().single();if(r.error)return alert(r.error.message);closeModal();renderPage()}function openRecord(id){let r=records.find(x=>x.id===id);if(!r)return;let p=r.properties||{};modalTitle.textContent=p.name||'Record';modalBody.innerHTML='<div class="record"><div><h4>Properties</h4>'+Object.entries(p).map(([k,v])=>'<p><span class="muted">'+esc(k)+'</span><br><b>'+esc(v||'—')+'</b></p>').join('')+'</div><div><h4>Activity timeline</h4><div id="recordTimeline" class="timeline">Loading...</div></div><div><h4>Associations</h4><div id="assocs">Loading...</div></div></div>';modal.classList.add('open');loadRecordDetails(id)}async function loadRecordDetails(id){let a=await sb.from('kip4_activities').select('*').eq('organization_id',org.id).order('created_at',{ascending:false});recordTimeline.innerHTML=(a.data||[]).filter(x=>x.subject).slice(0,20).map(x=>'<div class="activity"><b>'+esc(x.subject)+'</b><div class="muted">'+esc(x.activity_type)+' · '+new Date(x.created_at).toLocaleString('en-IN')+'</div><div>'+esc(x.body||'')+'</div></div>').join('')||'<div class="muted">No activity.</div>';let q=await sb.from('kip4_associations').select('*').or('from_record_id.eq.'+id+',to_record_id.eq.'+id);assocs.innerHTML=(q.data||[]).map(x=>'<p class="badge">'+esc(x.label||'Associated record')+'</p>').join(' ')||'<div class="muted">No associations yet.</div>'}function createActivity(){modalTitle.textContent='New Activity';modalBody.innerHTML='<div class="formgrid"><label>Subject<input id="a_subject" class="field"></label><label>Type<select id="a_type" class="field"><option>Call</option><option>Email</option><option>Meeting</option><option>Task</option><option>Note</option><option>WhatsApp</option></select></label><label>Due<input id="a_due" class="field" type="datetime-local"></label><label>Status<select id="a_status" class="field"><option>Open</option><option>Completed</option><option>Cancelled</option></select></label><label class="full">Notes<textarea id="a_body" class="field"></textarea></label></div><div style="text-align:right"><button class="btn primary" onclick="saveActivity()">Save Activity</button></div>';modal.classList.add('open')}async function saveActivity(){let r=await sb.from('kip4_activities').insert({organization_id:org.id,activity_type:a_type.value,subject:a_subject.value,body:a_body.value,due_at:a_due.value||null,status:a_status.value,owner_id:session.user.id,created_by:session.user.id});if(r.error)return alert(r.error.message);closeModal();renderPage()}function renderReports(){content.innerHTML='<div class="cards"><div class="card"><div class="muted">CRM data model</div><div class="metric">Objects + Properties</div></div><div class="card"><div class="muted">Associations</div><div class="metric">Two-way</div></div><div class="card"><div class="muted">Activities</div><div class="metric">Timeline</div></div><div class="card"><div class="muted">Pipelines</div><div class="metric">Configurable</div></div></div><div class="panel"><h3>Reporting foundation</h3><p class="muted">KIP Financial reports will be driven from the same records used by the CRM, avoiding separate reporting datasets.</p></div>'}function renderForecast(){content.innerHTML='<div class="panel"><h3>Sales Forecast</h3><p class="muted">Forecast is calculated from Deal stage, amount and close date. Create deals to populate this workspace.</p></div>'}function renderTeam(){content.innerHTML='<div class="panel"><h3>Users & Teams</h3><p class="muted">Organization owner and future team invitations are managed separately from CRM records.</p><button class="btn primary" onclick="inviteUser()">+ Invite User</button></div>'}function inviteUser(){alert('User invitation workflow will be enabled after email/role policy is configured in Supabase Auth.')}function renderSettings(){content.innerHTML='<div class="panel"><h3>CRM Settings</h3><p>Architecture: Objects → Records → Properties → Associations → Activities.</p><p class="muted">This fresh V4 installation uses isolated <b>kip4_</b> tables and does not depend on the previous CRM tables.</p><div class="notice">Run <b>supabase/kip-financial-v4-schema.sql</b> in Supabase before creating records.</div></div>'}function closeModal(){modal.classList.remove('open')}document.querySelectorAll('.nav[data-page]').forEach(x=>x.addEventListener('click',()=>navigate(x.dataset.page)));sb.auth.getSession().then(r=>{if(r.data.session)start(r.data.session)});sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT')location.reload()});</script>
<script>
/* KIP AI Meeting Agent - automatic login bootstrap */
(function () {
  const MEETING_FUNCTION = window.SUPABASE_CONFIG.url + '/functions/v1/meeting-agent';

  function addMeetingNav() {
    if (document.querySelector('[data-page="meetings"]')) return;
    const side = document.querySelector('.side');
    if (!side) return;
    const section = document.createElement('div');
    section.className = 'section';
    section.textContent = 'AI Intelligence';
    const btn = document.createElement('button');
    btn.className = 'nav';
    btn.dataset.page = 'meetings';
    btn.innerHTML = '◉ <span>AI Meetings</span>';
    btn.onclick = () => window.kipOpenMeetings();
    side.insertBefore(section, side.querySelector('.nav[onclick="logout()"]') || null);
    side.insertBefore(btn, side.querySelector('.nav[onclick="logout()"]') || null);
  }

  function addStatus() {
    if (document.getElementById('meetingAgentStatus')) return;
    const top = document.querySelector('.top');
    if (!top) return;
    const el = document.createElement('div');
    el.id = 'meetingAgentStatus';
    el.style.cssText = 'margin-left:auto;margin-right:12px;font-size:12px;font-weight:700;padding:6px 10px;border-radius:999px;background:#eef4ff;color:#245bb3';
    el.textContent = '● AI Meeting Agent ready';
    top.insertBefore(el, document.getElementById('action'));
  }

  window.kipOpenMeetings = function () {
    current = 'meetings';
    document.querySelectorAll('.nav[data-page]').forEach(x => x.classList.toggle('active', x.dataset.page === 'meetings'));
    pageTitle.textContent = 'AI Meetings';
    action.innerHTML = '<a class="btn primary" href="/lead.management/meeting-agent/">Open Meeting Agent</a>';
    content.innerHTML =
      '<div class="panel">' +
      '<h2>AI Meeting Agent</h2>' +
      '<p class="muted">The agent is initialized automatically when you sign in. It can process authorized meeting recordings and create AI notes, decisions, action items, risks and follow-ups.</p>' +
      '<div class="notice"><b>Automatic mode:</b> Agent is ready in the background after login. Meeting-platform capture must be connected separately before recordings can be collected automatically.</div>' +
      '<div class="toolbar"><a class="btn primary" href="/lead.management/meeting-agent/">Open Meeting Agent</a></div>' +
      '</div>';
  };

  async function initializeMeetingAgent() {
    addMeetingNav();
    addStatus();
    try {
      const s = await sb.auth.getSession();
      if (!s.data.session) return;
      window.KIP_MEETING_AGENT = {
        ready: true,
        userId: s.data.session.user.id,
        functionUrl: MEETING_FUNCTION,
        initializedAt: new Date().toISOString()
      };
      const status = document.getElementById('meetingAgentStatus');
      if (status) status.textContent = '● AI Meeting Agent ready';
    } catch (e) {
      const status = document.getElementById('meetingAgentStatus');
      if (status) {
        status.textContent = '● AI Meeting Agent offline';
        status.style.background = '#fff1f0';
        status.style.color = '#b42318';
      }
    }
  }

  const originalStart = window.start;
  window.start = async function (s) {
    await originalStart(s);
    await initializeMeetingAgent();
  };

  window.addEventListener('load', () => setTimeout(initializeMeetingAgent, 500));
})();
</script>
