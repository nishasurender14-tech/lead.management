<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIP Financial CRM</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase/config.js"></script>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Arial,sans-serif;background:#f6f8fb;color:#182230}
button,input,select,textarea{font:inherit}.hidden{display:none!important}.auth{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0b1736,#123c76)}
.authbox{width:min(440px,92vw);background:#fff;border-radius:22px;padding:34px;box-shadow:0 25px 80px #0005}.brand{font-weight:900;color:#1769e0}.authbox h1{margin:6px 0}
.field{width:100%;border:1px solid #d9e0ea;border-radius:10px;padding:11px 12px;margin:5px 0;background:#fff}.btn{border:1px solid #d7dee8;background:#fff;border-radius:9px;padding:9px 13px;cursor:pointer;font-weight:700}.btn.primary{background:#1769e0;color:#fff;border-color:#1769e0}.btn.danger{color:#b42318}
.shell{display:flex;min-height:100vh}.side{width:245px;background:#0d1b2a;color:#dbe6f5;position:fixed;inset:0 auto 0 0;padding:20px 14px;overflow:auto}.side h2{margin:0 10px 24px;color:#fff}.section{font-size:11px;text-transform:uppercase;color:#7f92aa;margin:18px 10px 7px;font-weight:800}.nav{width:100%;border:0;background:none;color:#cbd5e1;text-align:left;padding:10px 12px;border-radius:9px;cursor:pointer}.nav:hover,.nav.active{background:#173557;color:#fff}
.main{margin-left:245px;width:calc(100% - 245px)}.top{height:70px;background:#fff;border-bottom:1px solid #e4e9f0;display:flex;align-items:center;justify-content:space-between;padding:0 24px;position:sticky;top:0;z-index:5}.title h1{font-size:20px;margin:0}.content{padding:22px;max-width:1600px;margin:auto}.toolbar{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:15px}.search{min-width:280px;border:1px solid #d9e0ea;border-radius:9px;padding:9px 12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:18px}.card{background:#fff;border:1px solid #e5eaf0;border-radius:14px;padding:17px}.metric{font-size:26px;font-weight:850;margin-top:7px}.muted{color:#667085}.panel{background:#fff;border:1px solid #e5eaf0;border-radius:14px;padding:18px;margin-bottom:16px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:11px 9px;border-bottom:1px solid #eef1f5;text-align:left;white-space:nowrap}th{font-size:11px;color:#667085;text-transform:uppercase}tr:hover td{background:#fafbfd}.badge{display:inline-block;padding:4px 9px;border-radius:99px;background:#eef4ff;color:#245bb3;font-size:12px;font-weight:700}.empty{padding:45px;text-align:center;color:#667085}.modal{position:fixed;inset:0;background:#0b122099;display:none;place-items:center;z-index:30}.modal.open{display:grid}.modalbox{width:min(820px,94vw);max-height:90vh;overflow:auto;background:#fff;border-radius:16px;padding:22px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.full{grid-column:1/-1}.notice{padding:11px;border-radius:10px;background:#fff8e6;color:#8a5b00;margin-bottom:12px}.success{background:#ecfdf3;color:#087443}.demo-banner{background:#eef4ff;color:#174ea6;border-bottom:1px solid #d5e3ff;padding:8px 18px;font-size:12px;font-weight:700}.kanban{display:flex;gap:12px;overflow:auto}.stage{min-width:240px;background:#f1f4f8;border-radius:12px;padding:12px}.deal{background:#fff;padding:12px;border-radius:10px;margin-top:9px;border:1px solid #e5eaf0}.link{color:#1769e0;cursor:pointer;font-weight:700}.timeline{border-left:2px solid #e5e7eb;padding-left:16px}.activity{padding:10px 0;border-bottom:1px solid #eee}
@media(max-width:1000px){.side{width:70px}.side span,.section,.side h2{display:none}.main{margin-left:70px;width:calc(100% - 70px)}.cards{grid-template-columns:1fr 1fr}.formgrid{grid-template-columns:1fr}.full{grid-column:auto}}@media(max-width:600px){.cards{grid-template-columns:1fr}.search{min-width:180px}.content{padding:14px}}
</style></head><body>
<div id="auth" class="auth hidden"><div class="authbox"><div class="brand">KIP FINANCIAL</div><h1>Team Login</h1><p class="muted">Secure access to the live CRM workspace.</p><div id="authmsg"></div><input id="email" class="field" type="email" placeholder="Work email"><input id="password" class="field" type="password" placeholder="Password"><button class="btn primary" style="width:100%;margin-top:8px" onclick="login()">Sign in</button><button class="btn" style="width:100%;margin-top:8px" onclick="showPublicDemo()">← Public Demo</button></div></div>
<div id="app" class="shell hidden"><aside class="side"><h2>KIP FINANCIAL</h2>
<div class="section">Workspace</div><button class="nav active" data-page="dashboard">⌂ <span>Dashboard</span></button>
<div class="section">CRM</div><button class="nav" data-page="contacts">◉ <span>Contacts</span></button><button class="nav" data-page="companies">▣ <span>Companies</span></button><button class="nav" data-page="leads">◈ <span>Leads</span></button><button class="nav" data-page="deals">◆ <span>Deals</span></button><button class="nav" data-page="tickets">▤ <span>Tickets</span></button><button class="nav" data-page="activities">◷ <span>Activities</span></button><button class="nav" data-page="tasks">✓ <span>Tasks</span></button>
<div class="section">KIP Business</div><button class="nav" data-page="projects">▥ <span>Projects</span></button><button class="nav" data-page="tenders">◇ <span>Tenders</span></button><button class="nav" data-page="applications">▧ <span>Applications</span></button><button class="nav" data-page="schemes">◎ <span>Schemes & Subsidies</span></button><button class="nav" data-page="registrations">◫ <span>Registrations</span></button><button class="nav" data-page="documents">□ <span>Documents</span></button>
<div class="section">Revenue</div><button class="nav" data-page="services">▤ <span>Services</span></button><button class="nav" data-page="quotes">₹ <span>Quotes</span></button><button class="nav" data-page="invoices">₹ <span>Invoices</span></button><button class="nav" data-page="payments">₹ <span>Payments</span></button>
<div class="section">Marketing & Analytics</div><button class="nav" data-page="campaigns">◉ <span>Campaigns</span></button><button class="nav" data-page="reports">▥ <span>Reports</span></button><button class="nav" data-page="forecast">↗ <span>Forecast</span></button>
<div class="section">AI</div><button class="nav" data-page="meetings">◉ <span>AI Meetings</span></button>
<div class="section">Admin</div><button class="nav" data-page="team">♟ <span>Users & Teams</span></button><button class="nav" data-page="settings">⚙ <span>Settings</span></button><button class="nav" onclick="signOut()">↪ <span>Sign out</span></button>
</aside><main class="main"><header class="top"><div class="title"><h1 id="pageTitle">Dashboard</h1><small id="orgLabel" class="muted"></small></div><div id="action"></div></header><div id="content" class="content"></div></main></div>
<div id="modal" class="modal"><div class="modalbox"><div style="display:flex;justify-content:space-between;align-items:center"><h2 id="modalTitle">Create</h2><button class="btn" onclick="closeModal()">×</button></div><div id="modalBody"></div></div></div>
<script>
const sb=supabase.createClient(window.SUPABASE_CONFIG.url,window.SUPABASE_CONFIG.key);
let session=null,org=null,profile=null,current='dashboard',records=[],demo=true;
const objectMap={contacts:['Contacts','Contact'],companies:['Companies','Company'],leads:['Leads','Lead'],deals:['Deals','Deal'],tickets:['Tickets','Ticket'],projects:['Projects','Project'],tenders:['Tenders','Tender'],applications:['Applications','Application'],schemes:['Schemes & Subsidies','Scheme'],registrations:['Registrations','Registration'],documents:['Documents','Document'],services:['Services','Service'],quotes:['Quotes','Quote'],invoices:['Invoices','Invoice'],payments:['Payments','Payment'],campaigns:['Campaigns','Campaign'],activities:['Activities','Activity'],tasks:['Tasks','Task']};
const demoData={
contacts:[['Rajesh Kumar','rajesh@example.com','+91 98765 43210','Green Energy Pvt. Ltd.','KIP Team'],['Amit Sharma','amit@example.com','+91 98111 22334','BioPower Industries','KIP Team'],['Priya Mehta','priya@example.com','+91 98990 11223','EcoFuel Solutions','KIP Team']],
companies:[['Green Energy Pvt. Ltd.','Biomass','+91 11 4567 8900','greenenergy.example','KIP Team'],['BioPower Industries','Renewable Energy','+91 22 4567 1200','biopower.example','KIP Team'],['EcoFuel Solutions','CBG / Biomass','+91 20 4455 7788','ecofuel.example','KIP Team']],
leads:[['NTPC Biomass Tender','New','Website','KIP Team'],['CBG Project Enquiry','Contacted','Facebook','KIP Team'],['Subsidy Viability Report','Qualified','Google','KIP Team'],['Biomass Pellet Plant','Proposal','Webinar','KIP Team']],
deals:[['NTPC Tender Consultancy','Proposal',125000,'2026-10-30','KIP Team'],['Biomass Project Report','Negotiation',275000,'2026-11-15','KIP Team'],['CBG Subsidy Advisory','Closed Won',180000,'2026-10-05','KIP Team']],
tickets:[['Tender Document Query','Open','WhatsApp','KIP Team'],['Subsidy Eligibility','In Progress','Email','KIP Team']],
projects:[['Biomass Pellet Plant Project','Active','Consultancy','KIP Team'],['CBG Project Feasibility','Planning','Consultancy','KIP Team']],
tenders:[['NTPC Biomass Pellet Tender','Open','NTPC','KIP Team'],['State Biomass Procurement','Monitoring','Government Portal','KIP Team']],
applications:[['Biomass Subsidy Application','In Progress','KIP Consultancy','KIP Team'],['CBG Incentive Application','Under Review','KIP Consultancy','KIP Team']],
schemes:[['Biomass Project Support','Eligible','Government Scheme','KIP Team'],['CBG / Waste-to-Energy Support','Review','Government Scheme','KIP Team']],
registrations:[['Udyam Registration','Completed','KIP Consultancy','KIP Team'],['IEM Registration','In Progress','KIP Consultancy','KIP Team']],
documents:[['Subsidy Viability Report','Ready','Project','KIP Team'],['NTPC Tender Documents','Review','Tender','KIP Team']],
services:[['Subsidy Viability Report','Active','Consultancy','KIP Team'],['Tender Consultancy','Active','Consultancy','KIP Team']],
quotes:[['Quote - Biomass Project','Sent','Sales','KIP Team'],['Quote - Tender Consultancy','Accepted','Sales','KIP Team']],
invoices:[['INV-2026-001','Paid','Billing','KIP Team'],['INV-2026-002','Pending','Billing','KIP Team']],
payments:[['Payment - Green Energy','Received','Invoice','KIP Team'],['Payment - BioPower','Pending','Invoice','KIP Team']],
campaigns:[['NTPC Tender Promotion','Running','Facebook + Google','KIP Team'],['Biomass Webinar Campaign','Completed','Email + WhatsApp','KIP Team']],
activities:[['NTPC Tender Follow-up','Open','Call','KIP Team'],['Customer Meeting','Completed','Meeting','KIP Team']],
tasks:[['Follow up with NTPC tender lead','Open','High','2026-10-12','KIP Team'],['Prepare subsidy viability report','In Progress','Medium','2026-10-15','KIP Team']]
};
let demoLocal={};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const money=n=>new Intl.NumberFormat('en-IN',{style:'currency',currency:'INR',maximumFractionDigits:0}).format(Number(n||0));
function makeDemo(type){let a=demoLocal[type]||demoData[type]||[];return a.map((x,i)=>{if(x.properties)return {...x};let p={name:x[0],status:x[1],source:x[2],owner:x[3]};if(type==='contacts')p={name:x[0],email:x[1],phone:x[2],company:x[3],owner:x[4]};if(type==='companies')p={name:x[0],industry:x[1],phone:x[2],website:x[3],owner:x[4]};if(type==='deals')p={name:x[0],stage:x[1],amount:x[2],close_date:x[3],owner:x[4]};if(type==='tasks')p={name:x[0],status:x[1],priority:x[2],due_at:x[3],owner:x[4]};return{id:'demo-'+type+'-'+i,properties:p}})}
function showPublicDemo(){demo=true;session=null;org=null;profile=null;auth.classList.add('hidden');app.classList.remove('hidden');document.getElementById('demoBanner')?.remove();const b=document.createElement('div');b.id='demoBanner';b.className='demo-banner';b.innerHTML='PUBLIC DEMO MODE · Sample data only <button class="btn" style="float:right;margin-top:-5px;padding:5px 10px" onclick="showLogin()">Team Login</button>';document.querySelector('.main').prepend(b);orgLabel.textContent='KIP Financial · Public Demo';navigate('dashboard')}
function showLogin(){demo=false;app.classList.add('hidden');auth.classList.remove('hidden');authmsg.innerHTML='';email.focus()}
async function login(){const r=await sb.auth.signInWithPassword({email:email.value.trim(),password:password.value});if(r.error)return authmsg.innerHTML='<div class="notice">'+esc(r.error.message)+'</div>';await boot(r.data.session)}
async function boot(s){session=s;demo=false;let r=await sb.from('kip4_profiles').select('*').eq('id',s.user.id).maybeSingle();if(r.error)return fail(r.error.message);profile=r.data;if(!profile){const name=prompt('Your full name')||s.user.email.split('@')[0];const orgname=prompt('Organization name')||'KIP Financial';r=await sb.rpc('kip4_create_org',{org_name:orgname,user_name:name});if(r.error)return fail(r.error.message);r=await sb.from('kip4_profiles').select('*').eq('id',s.user.id).single();profile=r.data}r=await sb.from('kip4_organizations').select('*').eq('id',profile.organization_id).single();if(r.error)return fail(r.error.message);org=r.data;document.getElementById('demoBanner')?.remove();auth.classList.add('hidden');app.classList.remove('hidden');orgLabel.textContent=org?.name||'KIP Financial';navigate('dashboard')}
function fail(x){auth.classList.remove('hidden');app.classList.add('hidden');authmsg.innerHTML='<div class="notice">'+esc(x)+'</div>'}
async function signOut(){if(demo)return showPublicDemo();await sb.auth.signOut();showPublicDemo()}
async function getRecords(type){if(demo)return makeDemo(type);if(!org)return[];const r=await sb.from('kip4_records').select('*').eq('organization_id',org.id).eq('object_type',type).order('created_at',{ascending:false});if(r.error){alert(r.error.message);return[]}return r.data||[]}
function navigate(page){current=page;document.querySelectorAll('.nav[data-page]').forEach(x=>x.classList.toggle('active',x.dataset.page===page));pageTitle.textContent=page==='dashboard'?'Dashboard':objectMap[page]?.[0]||({reports:'Reports',forecast:'Forecast',team:'Users & Teams',settings:'Settings',meetings:'AI Meetings'}[page]||page);renderAction();renderPage()}
function renderAction(){action.innerHTML='';if(objectMap[current]&&current!=='activities'){action.innerHTML='<button class="btn primary" onclick="openEditor()">+ New '+objectMap[current][1]+'</button>'}else if(current==='activities'){action.innerHTML='<button class="btn primary" onclick="openActivity()">+ New Activity</button>'}else if(current==='team'){action.innerHTML='<button class="btn primary" onclick="inviteUser()">+ Invite User</button>'}else if(current==='meetings'){action.innerHTML='<a class="btn primary" href="/lead.management/meeting-agent/">Open Meeting Agent</a>'}}
async function renderPage(){if(current==='dashboard')return renderDashboard();if(current==='meetings')return renderMeetings();if(current==='deals')return renderDeals();if(objectMap[current])return renderObject(current);if(current==='reports')return renderReports();if(current==='forecast')return renderForecast();if(current==='team')return renderTeam();if(current==='settings')return renderSettings()}
async function renderDashboard(){const [l,c,d,t,task]=await Promise.all(['leads','contacts','deals','tickets','tasks'].map(getRecords));const pipe=d.reduce((a,x)=>a+Number(x.properties?.amount||0),0),won=d.filter(x=>x.properties?.stage==='Closed Won').reduce((a,x)=>a+Number(x.properties?.amount||0),0);content.innerHTML='<div class="cards">'+[['Leads',l.length],['Contacts',c.length],['Open Deals',d.filter(x=>!['Closed Won','Closed Lost'].includes(x.properties?.stage)).length],['Pipeline',money(pipe)]].map(x=>'<div class="card"><div class="muted">'+x[0]+'</div><div class="metric">'+x[1]+'</div></div>').join('')+'</div><div class="panel"><h3>Sales Overview</h3><p class="muted">Won revenue: <b>'+money(won)+'</b> · Tickets: <b>'+t.length+'</b> · Open tasks: <b>'+task.filter(x=>x.properties?.status!=='Completed').length+'</b></p></div><div class="panel"><h3>Quick Actions</h3><div class="toolbar"><button class="btn" onclick="navigate(\'leads\')">Leads</button><button class="btn" onclick="navigate(\'contacts\')">Contacts</button><button class="btn" onclick="navigate(\'deals\')">Pipeline</button><button class="btn" onclick="navigate(\'tasks\')">Tasks</button><button class="btn" onclick="navigate(\'meetings\')">AI Meetings</button></div></div>'}
function tableColumns(page){if(page==='contacts')return[['name','Name'],['email','Email'],['phone','Phone'],['company','Company'],['owner','Owner']];if(page==='companies')return[['name','Company'],['industry','Industry'],['phone','Phone'],['website','Website'],['owner','Owner']];if(page==='deals')return[['name','Deal'],['stage','Stage'],['amount','Amount'],['close_date','Close Date'],['owner','Owner']];if(page==='tasks')return[['name','Task'],['status','Status'],['priority','Priority'],['due_at','Due'],['owner','Owner']];return[['name','Name'],['status','Status'],['source','Source'],['owner','Owner'],['created_at','Created']]}
async function renderObject(page){records=await getRecords(page);content.innerHTML='<div class="toolbar"><input id="listSearch" class="search" placeholder="Search '+objectMap[page][0]+'..." oninput="filterList()"><select id="statusFilter" class="field" style="width:auto" onchange="filterList()"><option value="">All status</option><option>New</option><option>Open</option><option>In Progress</option><option>Qualified</option><option>Proposal</option><option>Completed</option><option>Closed Won</option><option>Closed Lost</option></select><span class="muted" id="countLabel">'+records.length+' records</span></div><div class="panel"><div id="table"></div></div>';drawTable(records,page)}
function filterList(){const q=(document.getElementById('listSearch')?.value||'').toLowerCase(),s=document.getElementById('statusFilter')?.value||'';drawTable(records.filter(r=>{const p=r.properties||{};return JSON.stringify(p).toLowerCase().includes(q)&&(!s||p.status===s||p.stage===s)}),current)}
function drawTable(data,page){if(!data.length){table.innerHTML='<div class="empty">No records found.<br><br><button class="btn primary" onclick="openEditor()">Create '+objectMap[page][1]+'</button></div>';return}const cols=tableColumns(page);table.innerHTML='<div class="tablewrap"><table><thead><tr>'+cols.map(c=>'<th>'+c[1]+'</th>').join('')+'<th>Actions</th></tr></thead><tbody>'+data.map(r=>{const p=r.properties||{};return '<tr>'+cols.map(c=>'<td class="'+(c[0]==='name'?'link':'')+'" onclick="openRecord(\''+r.id+'\')">'+esc(c[0]==='amount'?money(p[c[0]]):c[0]==='created_at'?new Date(r.created_at||Date.now()).toLocaleDateString('en-IN'):p[c[0]]||'—')+'</td>').join('')+'<td><button class="btn" onclick="event.stopPropagation();openEditor(\''+r.id+'\')">Edit</button> <button class="btn danger" onclick="event.stopPropagation();deleteRecord(\''+r.id+'\')">Delete</button></td></tr>'}).join('')+'</tbody></table></div>'}
function fieldSpec(page){if(page==='contacts')return[['name','Full name','text'],['email','Email','email'],['phone','Phone','text'],['company','Company','text'],['job_title','Job title','text'],['owner','Owner','text']];if(page==='companies')return[['name','Company name','text'],['industry','Industry','text'],['phone','Phone','text'],['website','Website','text'],['owner','Owner','text']];if(page==='deals')return[['name','Deal name','text'],['amount','Amount','number'],['stage','Stage','select','New|Qualification|Needs Analysis|Proposal|Negotiation|Closed Won|Closed Lost'],['close_date','Close date','date'],['owner','Owner','text']];if(page==='tasks')return[['name','Task title','text'],['status','Status','select','Open|In Progress|Completed|Cancelled'],['priority','Priority','select','High|Medium|Low'],['due_at','Due date','date'],['owner','Owner','text']];return[['name','Name / Title','text'],['status','Status','select','New|Open|In Progress|Qualified|Proposal|Completed|Closed|Cancelled'],['source','Source','text'],['owner','Owner','text'],['notes','Notes','textarea']]}
function openEditor(id){const page=current,old=records.find(r=>r.id===id),p=old?.properties||{};modalTitle.textContent=(old?'Edit ':'New ')+objectMap[page][1];modalBody.innerHTML='<div class="formgrid">'+fieldSpec(page).map(f=>{let v=esc(p[f[0]]||'');if(f[2]==='textarea')return '<label class="full">'+f[1]+'<textarea id="f_'+f[0]+'" class="field" rows="5">'+v+'</textarea></label>';if(f[2]==='select')return '<label>'+f[1]+'<select id="f_'+f[0]+'" class="field">'+f[3].split('|').map(o=>'<option '+(o===p[f[0]]?'selected':'')+'>'+o+'</option>').join('')+'</select></label>';return '<label>'+f[1]+(f[0]==='name'?' *':'')+'<input id="f_'+f[0]+'" class="field" type="'+f[2]+'" value="'+v+'"></label>'}).join('')+'</div><div style="text-align:right;margin-top:16px"><button class="btn" onclick="closeModal()">Cancel</button> <button class="btn primary" onclick="saveEditor(\''+(id||'')+'\')">'+(old?'Save Changes':'Create')+'</button></div>';modal.classList.add('open')}
async function saveEditor(id){const props={};document.querySelectorAll('#modalBody [id^="f_"]').forEach(x=>props[x.id.slice(2)]=x.value);if(!props.name?.trim())return alert('Name is required');if(demo){if(id){const a=demoLocal[current]||makeDemo(current);const x=a.find(r=>r.id===id);if(x)x.properties=props;demoLocal[current]=a}else{(demoLocal[current]||(demoLocal[current]=makeDemo(current))).unshift({id:'demo-'+Date.now(),properties:props})}closeModal();await renderPage();return}const payload={object_type:current,properties:props,organization_id:org.id,owner_id:session.user.id};let r=id?await sb.from('kip4_records').update({properties:props,updated_at:new Date().toISOString()}).eq('id',id).eq('organization_id',org.id):await sb.from('kip4_records').insert(payload);if(r.error)return alert(r.error.message);closeModal();await renderPage()}
async function deleteRecord(id){if(!confirm('Delete this record?'))return;if(demo){demoLocal[current]=(demoLocal[current]||makeDemo(current)).filter(x=>x.id!==id);return renderPage()}const r=await sb.from('kip4_records').delete().eq('id',id).eq('organization_id',org.id);if(r.error)return alert(r.error.message);renderPage()}
function openRecord(id){const r=records.find(x=>x.id===id);if(!r)return;const p=r.properties||{};modalTitle.textContent=p.name||'Record';modalBody.innerHTML='<div class="toolbar"><button class="btn primary" onclick="openEditor(\''+id+'\')">Edit</button><button class="btn danger" onclick="deleteRecord(\''+id+'\');closeModal()">Delete</button></div><div class="formgrid">'+Object.entries(p).map(([k,v])=>'<div><span class="muted">'+esc(k)+'</span><br><b>'+esc(v||'—')+'</b></div>').join('')+'</div><hr><h3>Activity Timeline</h3><div id="recordTimeline">Loading...</div>';modal.classList.add('open');loadTimeline(id)}
async function loadTimeline(id){if(demo){recordTimeline.innerHTML='<div class="muted">Demo timeline — sample activity only.</div>';return}const r=await sb.from('kip4_activities').select('*').eq('organization_id',org.id).order('created_at',{ascending:false}).limit(20);recordTimeline.innerHTML=(r.data||[]).map(x=>'<div class="activity"><b>'+esc(x.subject)+'</b><div class="muted">'+esc(x.activity_type)+' · '+new Date(x.created_at).toLocaleString('en-IN')+'</div><div>'+esc(x.body||'')+'</div></div>').join('')||'<div class="muted">No activity.</div>'}
function openActivity(){modalTitle.textContent='New Activity';modalBody.innerHTML='<div class="formgrid"><label>Subject<input id="a_subject" class="field"></label><label>Type<select id="a_type" class="field"><option>Call</option><option>Email</option><option>Meeting</option><option>Task</option><option>Note</option><option>WhatsApp</option></select></label><label>Due<input id="a_due" class="field" type="datetime-local"></label><label>Status<select id="a_status" class="field"><option>Open</option><option>Completed</option><option>Cancelled</option></select></label><label class="full">Notes<textarea id="a_body" class="field" rows="5"></textarea></label></div><div style="text-align:right"><button class="btn primary" onclick="saveActivity()">Save Activity</button></div>';modal.classList.add('open')}
async function saveActivity(){if(!a_subject.value.trim())return alert('Subject is required');if(demo){alert('Demo Mode: activity saved only for this browser session.');closeModal();return}const r=await sb.from('kip4_activities').insert({organization_id:org.id,activity_type:a_type.value,subject:a_subject.value,body:a_body.value,due_at:a_due.value||null,status:a_status.value,owner_id:session.user.id,created_by:session.user.id});if(r.error)return alert(r.error.message);closeModal();renderPage()}
async function renderDeals(){const d=await getRecords('deals');const stages=['New','Qualification','Needs Analysis','Proposal','Negotiation','Closed Won','Closed Lost'];content.innerHTML='<div class="kanban">'+stages.map(s=>'<div class="stage"><b>'+s+'</b>'+d.filter(x=>x.properties?.stage===s).map(x=>'<div class="deal"><b>'+esc(x.properties.name)+'</b><div class="muted">'+money(x.properties.amount)+'</div><small>'+esc(x.properties.owner||'')+'</small><br><button class="btn" onclick="openEditor(\''+x.id+'\')">Edit</button></div>').join('')+'</div>').join('')+'</div>'}
function renderMeetings(){content.innerHTML='<div class="panel"><h2>AI Meeting Agent</h2><p class="muted">Recordings can be transcribed and converted into summaries, decisions, customer requirements, risks and action items.</p><div class="notice">'+(demo?'Public Demo: live recordings require Team Login.':'Live CRM mode: your authenticated meeting workspace is available.')+'</div><a class="btn primary" href="/lead.management/meeting-agent/">Open Meeting Agent</a></div>'}
function renderReports(){content.innerHTML='<div class="cards"><div class="card"><div class="muted">CRM Architecture</div><div class="metric">Live</div></div><div class="card"><div class="muted">Objects</div><div class="metric">'+Object.keys(objectMap).length+'</div></div><div class="card"><div class="muted">Data Store</div><div class="metric">'+(demo?'Demo':'Supabase')+'</div></div><div class="card"><div class="muted">AI</div><div class="metric">Enabled</div></div></div><div class="panel"><h3>Operational Reporting</h3><p class="muted">Dashboard, pipeline, activities, tasks and object-level data are driven from the same CRM records.</p></div>'}
async function renderForecast(){const d=await getRecords('deals');const stages=['Proposal','Negotiation','Closed Won'];content.innerHTML='<div class="panel"><h2>Sales Forecast</h2>'+stages.map(s=>{const x=d.filter(r=>r.properties?.stage===s),v=x.reduce((a,r)=>a+Number(r.properties?.amount||0),0);return '<div class="card" style="margin:8px 0"><b>'+s+'</b><div class="metric">'+money(v)+'</div><span class="muted">'+x.length+' deals</span></div>'}).join('')+'</div>'}
function renderTeam(){content.innerHTML='<div class="panel"><h2>Users & Teams</h2><p class="muted">User access is controlled by Supabase Authentication and organization membership.</p><button class="btn primary" onclick="inviteUser()">+ Invite User</button></div>'}
function inviteUser(){alert(demo?'Team invitations are available in live CRM mode after Team Login.':'Configure Supabase Auth email invitations to onboard team members.')}
function renderSettings(){content.innerHTML='<div class="panel"><h2>CRM Settings</h2><p>Organization: <b>'+esc(org?.name||'Public Demo')+'</b></p><p class="muted">Live CRM data is isolated by organization through Supabase Row Level Security.</p></div>'}
function closeModal(){modal.classList.remove('open')}
document.querySelectorAll('.nav[data-page]').forEach(x=>x.addEventListener('click',()=>navigate(x.dataset.page)));
sb.auth.getSession().then(r=>{if(r.data.session&&sessionStorage.getItem('kip_team_login')==='1')boot(r.data.session);else showPublicDemo()});
sb.auth.onAuthStateChange((e,s)=>{if(e==='SIGNED_OUT')showPublicDemo();if(e==='SIGNED_IN'){sessionStorage.setItem('kip_team_login','1');boot(s)}});
</script></body></html>
